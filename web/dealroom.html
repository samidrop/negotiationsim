<title>The Deal Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#F6F2E9; --panel:#FFFDF8; --raised:#F1EBDD; --edge:#E0D8C7; --edge-lit:#C2B8A2;
    --cream:#EFE7D6; --cream-deep:#E4D9C2;
    --ink:#1B1A18; --ink-dim:#5C574F; --ink-faint:#8B857A;
    --you:#1F4E79; --you-soft:#E6EDF4; --them:#C4643C; --them-soft:#FAEAE1;
    --bad:#B3382C; --good:#3F7A4A;
    --shadow:0 1px 2px rgba(30,26,20,.05),0 6px 20px rgba(30,26,20,.07);
    --display:"Zilla Slab",Georgia,serif;
    --body:"Archivo","Helvetica Neue",Arial,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
  h1,h2,h3,h4{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:var(--body);font:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--you);outline-offset:2px}

  /* ---------------- top bar ---------------- */
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .topbar .spacer{flex:1}
  .brandbtn{background:none;border:0;padding:4px;display:flex;align-items:center;gap:10px;border-radius:10px}
  .brandbtn:hover{background:var(--raised)}
  .wordmark{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em;color:var(--ink)}
  .wordmark b{color:var(--you);font-weight:700}
  .crumb{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}

  /* ---------------- menu ---------------- */
  .menu{position:relative;border:1px solid var(--edge);border-radius:18px;overflow:hidden;
    background:#E4E8EB;box-shadow:var(--shadow);min-height:clamp(560px,88vh,820px);display:flex;flex-direction:column}
  .menu-art{position:relative;flex:1 1 auto;min-height:190px;line-height:0;overflow:hidden}
  .menu-art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .menu-art::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 34%,rgba(247,242,231,.55) 100%)}
  .menu-inner{
    position:relative;padding:clamp(24px,4vw,38px) clamp(22px,5vw,42px) clamp(22px,4vw,34px);
    margin-top:auto;width:100%;text-align:center;
    background:linear-gradient(180deg,rgba(247,242,231,.90),rgba(239,231,214,.97));
    backdrop-filter:blur(12px);
    border-top:1px solid rgba(27,26,24,.12);
    box-shadow:0 -16px 44px rgba(60,48,28,.14);
  }
  .menu-brand{display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:4px}
  .menu-brand .logomark{flex:none;filter:drop-shadow(0 3px 10px rgba(30,26,20,.18))}
  .menu-title{font-family:var(--display);font-weight:700;letter-spacing:.005em;
    font-size:clamp(32px,6vw,54px);line-height:1;margin:0}
  .menu-title b{color:var(--you)}
  .menu-tag{color:var(--ink-dim);font-size:clamp(14px,1.8vw,16.5px);max-width:54ch;margin:10px auto 22px}
  .menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(224px,1fr));gap:14px;
    max-width:920px;margin:0 auto}
  .tile{
    display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
    background:var(--panel);border:1px solid var(--edge);border-radius:16px;
    padding:20px;color:var(--ink);transition:.18s;
    box-shadow:0 1px 2px rgba(60,48,28,.06),0 8px 24px rgba(60,48,28,.09);
  }
  .tile:hover{border-color:var(--ink-faint);transform:translateY(-2px);background:#fff}
  .tile .ic{flex:none;width:62px;height:62px}
  .tile .tx{min-width:0}
  .tile .tx b{display:block;font-family:var(--display);font-size:20px;font-weight:600;margin-bottom:2px}
  .tile .tx span{display:block;font-size:13.5px;color:var(--ink-dim);line-height:1.38}
  .tile.lead{background:var(--you);border-color:var(--you);color:#fff}
  .tile.lead:hover{background:#2A5F8E;border-color:#2A5F8E;transform:translateY(-2px)}
  .tile.lead .tx span{color:rgba(255,255,255,.82)}
  .menu-foot{display:flex;gap:12px;align-items:center;margin:18px auto 0;max-width:920px}
  .settingsbar{
    display:flex;align-items:center;gap:12px;width:100%;
    background:rgba(255,253,248,.7);border:1px solid var(--edge);border-radius:13px;
    padding:11px 15px;color:var(--ink-dim);font-size:13.5px;text-align:left;transition:.16s;
  }
  .settingsbar:hover{border-color:var(--ink-faint);background:var(--panel)}
  .settingsbar .gear{flex:none;width:22px;height:22px}
  .settingsbar b{color:var(--ink);font-weight:600;font-family:var(--display);font-size:15px}
  .settingsbar span{text-align:left}
  .settingsbar .now{margin-left:auto;font-size:12px;color:var(--ink-faint);text-align:right}
  .setlist{display:flex;flex-direction:column;gap:14px;margin-top:16px}
  .setrow{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .setrow b{display:block;font-family:var(--display);font-size:15.5px;color:var(--ink)}
  .setrow span{display:block;font-size:12.5px;color:var(--ink-dim);max-width:34ch}
  .switch{display:inline-flex;align-items:center;gap:8px;background:var(--raised);
    border:1px solid var(--edge);border-radius:99px;padding:5px 6px 5px 12px;color:var(--ink-dim);font-size:12.5px}
  .switch button{border:0;border-radius:99px;padding:4px 11px;font-size:12px;background:transparent;color:var(--ink-faint)}
  .switch button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .castgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
  .castcard{background:var(--panel);border:1px solid var(--edge);border-radius:13px;overflow:hidden}
  .castart{line-height:0;border-bottom:1px solid var(--edge)}
  .castart svg{width:100%;height:auto;display:block}
  .castbody{padding:13px 15px 15px}
  .castbody b{font-family:var(--display);font-size:17px}
  .castbody p{margin:6px 0 0;font-size:13px;color:var(--ink-dim)}
  .castrow span{display:inline-block;min-width:44px;font-size:10.5px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--ink-faint)}
  .castrow.tell{color:var(--them)}
  .tutbar{display:flex;gap:12px;align-items:flex-start;border:1px solid #C3D4E3;
    border-left:4px solid var(--you);background:var(--you-soft);border-radius:11px;
    padding:12px 15px;margin-bottom:12px}
  .tutbar .step{font-size:12px;font-weight:700;color:#fff;background:var(--you);
    border-radius:99px;padding:3px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tutbody{flex:1;min-width:0}
  .tutbar p{margin:0;font-size:14.5px;line-height:1.55}
  .tutacts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn.small{padding:7px 13px;font-size:13px}
  .pulse{animation:pulse 1.5s ease-in-out infinite;position:relative;z-index:2}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,78,121,.55)}50%{box-shadow:0 0 0 8px rgba(31,78,121,0)}}
  .twinkle{animation:twinkle 4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.6}50%{opacity:.18}}
  .drift{animation:drift 9s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .btn{
    border:1px solid var(--edge);background:var(--raised);color:var(--ink);
    border-radius:9px;padding:10px 15px;font-size:14px;font-weight:500;transition:.15s;
  }
  .btn:hover{border-color:var(--edge-lit)}
  .btn.primary{background:var(--you);border-color:var(--you);color:#fff;font-weight:700}
  .btn.primary:hover{filter:brightness(1.12)}
  .btn.ghost{background:transparent}
  .btn.small{padding:7px 12px;font-size:13px}
  .btn.danger:hover{border-color:var(--bad);color:var(--bad)}

  /* ---------------- the scene ---------------- */
  .scene{
    position:relative;border:1px solid var(--edge);border-radius:14px 14px 0 0;
    overflow:hidden;background:#EDEAE3;line-height:0;
  }
  .scene svg{width:100%;height:auto;display:block}
  .scene::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 95% at 50% 34%,transparent 58%,rgba(40,34,26,.20) 100%);
  }
  #figure{transform-box:view-box;transform-origin:480px 430px;animation:breathe 4.6s ease-in-out infinite}
  #fig-head{transform-box:view-box;transform-origin:480px 330px;animation:sway 11s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2.5px) scaleY(1.006)}}
  @keyframes sway{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.9deg)}}
  #figure.shrug{animation:breathe 4.6s ease-in-out infinite,shrug .9s ease-in-out}
  #figure.glance{animation:breathe 4.6s ease-in-out infinite,glance .9s ease-in-out}
  @keyframes shrug{30%,60%{transform:translateY(-7px)}}
  #figure.leanin{animation:breathe 4.6s ease-in-out infinite,leanin 2.2s ease-in-out}
  #figure.leanback{animation:breathe 4.6s ease-in-out infinite,leanback 2.2s ease-in-out}
  @keyframes leanin{30%,70%{transform:translateY(9px) scale(1.035)}}
  @keyframes leanback{30%,70%{transform:translateY(-8px) scale(.975)}}
  .scene.recoil{animation:recoil .5s ease-out}
  @keyframes recoil{35%{transform:translateY(-5px)}}
  @keyframes glance{40%{transform:translateX(6px) rotate(.5deg)}}
  .nomotion #figure,.nomotion #fig-head{animation:none!important}
  #fig-eyes .pupil{transition:transform .42s cubic-bezier(.3,.8,.4,1)}
  /* A term sheet actually crossing the desk, in whichever direction. */
  #paper{transform-box:view-box;opacity:0}
  #paper.out{animation:paperOut 1.05s cubic-bezier(.3,.7,.4,1) forwards}
  #paper.in{animation:paperIn 1.05s cubic-bezier(.3,.7,.4,1) forwards}
  @keyframes paperOut{
    0%{opacity:0;transform:translate(0,90px) rotate(-3deg) scale(.86)}
    18%{opacity:1}
    100%{opacity:0;transform:translate(6px,-52px) rotate(4deg) scale(.62)}}
  @keyframes paperIn{
    0%{opacity:0;transform:translate(6px,-52px) rotate(4deg) scale(.62)}
    18%{opacity:1}
    100%{opacity:0;transform:translate(0,92px) rotate(-2deg) scale(.9)}}
  .scene.shake{animation:shake .55s}
  .scene.pop{animation:pop .5s}
  @keyframes shake{10%,90%{transform:translateX(-4px)}30%,70%{transform:translateX(8px)}50%{transform:translateX(-9px)}}
  @keyframes pop{45%{transform:scale(1.012)}}

  /* ---------------- dialogue box ---------------- */
  .dialogue{
    border:1px solid var(--edge);border-top:0;background:var(--panel);
    padding:15px 19px 17px;min-height:136px;position:relative;
  }
  .dl-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .dl-name{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.01em}
  .dl-role{font-size:12px;color:var(--ink-faint)}
  .dl-head .spacer{flex:1}
  .dl-round{
    font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-dim);
    border:1px solid var(--edge);border-radius:99px;padding:3px 10px;white-space:nowrap;
  }
  .dl-text{margin:0;font-size:17px;line-height:1.55;min-height:3.1em}
  .dl-text::after{content:"▌";color:var(--you);opacity:0;margin-left:2px}
  .dl-text.typing::after{opacity:1;animation:blink .8s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .dl-note{
    margin-top:10px;padding-top:9px;border-top:1px dashed var(--edge);
    font-size:13px;color:var(--ink-dim);
  }
  .dl-note b{color:var(--ink)}

  /* ---------------- action bar ---------------- */
  .actions{
    display:flex;gap:8px;flex-wrap:wrap;border:1px solid var(--edge);border-top:0;
    border-radius:0 0 14px 14px;background:var(--panel);padding:12px 14px;
  }
  .actions .spacer{flex:1}
  .say-row{display:flex;gap:8px;width:100%;margin-top:4px}
  .say-row input{
    flex:1;min-width:0;background:var(--raised);border:1px solid var(--edge);color:var(--ink);
    border-radius:9px;padding:10px 12px;font-size:14px;
  }
  .say-row input::placeholder{color:var(--ink-faint)}

  /* ---------------- term sheet drawer ---------------- */
  .backdrop{position:fixed;inset:0;background:rgba(40,34,26,.34);z-index:60;animation:fade .2s}
  .drawer{
    position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:70;
    width:min(100%,1040px);max-height:min(86vh,860px);overflow:auto;
    background:var(--panel);border:1px solid var(--edge);border-bottom:0;
    border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -18px 60px rgba(40,34,26,.22);animation:rise .28s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes rise{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .grip{width:44px;height:4px;border-radius:99px;background:var(--edge-lit);margin:0 auto 14px}
  .drawer-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}

  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;align-items:start}
  @media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
  .card{background:var(--raised);border:1px solid var(--edge);border-radius:11px;padding:13px 14px}
  .castcard,.trade{box-shadow:var(--shadow)}

  .sheet{width:100%;border-collapse:collapse;font-size:14px}
  .sheet td{padding:5px 0;border-bottom:1px solid rgba(58,52,44,.55)}
  .sheet td:first-child{color:var(--ink-dim)}
  .sheet td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-faint);width:38px}
  .sheet tr:last-child td{border-bottom:0}

  .terms{display:flex;flex-direction:column;gap:12px}
  .term-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
  .term-name{font-family:var(--display);font-size:15px;font-weight:600}
  .stake{font-size:11px;color:var(--ink-faint);white-space:nowrap}
  .opts{display:flex;gap:6px;flex-wrap:wrap}
  .opt{
    flex:1 1 0;min-width:78px;background:var(--panel);color:var(--ink-dim);
    border:1px solid var(--edge);border-radius:8px;padding:7px 6px;text-align:center;
    font-size:13px;transition:.14s;
  }
  .opt:hover{border-color:var(--you);color:var(--ink);background:var(--you-soft)}
  .opt .pts{display:block;font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .theirpts{font-style:normal;color:var(--them)}
  .opt[aria-pressed="true"] .theirpts{color:#FFD9C4}
  .opt[aria-pressed="true"]{background:var(--you);border-color:var(--you);color:#fff}
  .opt[aria-pressed="true"] .pts{color:rgba(255,255,255,.82)}
  .opt.theirs{box-shadow:inset 0 -3px 0 var(--them)}

  .meter{margin-top:14px}
  .meter-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
  .meter-top b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
  .bar{position:relative;height:16px;background:var(--raised);border:1px solid var(--edge);border-radius:6px;overflow:hidden}
  .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#6E9BC2,var(--you));transition:width .35s ease}
  .fill.under{background:linear-gradient(90deg,#D98A80,var(--bad))}
  .floor{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);z-index:2}
  .meter-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-top:5px}

  /* ---------------- brief + debrief ---------------- */
  .panel{background:var(--panel);border:1px solid var(--edge);border-radius:13px;padding:18px;box-shadow:var(--shadow)}
  .panel + .panel{margin-top:14px}
  .lede{font-size:17px;color:var(--ink-dim);max-width:62ch}
  .lede strong{color:var(--ink);font-weight:600}
  .split{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:16px}
  .rule{height:1px;background:var(--edge);margin:20px 0}
  .prio-row{display:grid;grid-template-columns:1fr 110px 34px;gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
  .prio-bar{height:9px;background:var(--raised);border:1px solid var(--edge);border-radius:99px;overflow:hidden}
  .prio-bar i{display:block;height:100%;background:var(--you);border-radius:99px}
  .prio-row span:last-child{text-align:right;color:var(--ink-faint);font-variant-numeric:tabular-nums}

  .verdict{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .medal{width:104px;height:104px;flex:none}
  .rankname{font-family:var(--display);font-size:clamp(28px,4.6vw,40px);font-weight:700;line-height:1.05}
  .rankname.gold{color:#A8801E} .rankname.silver{color:#6E7579}
  .rankname.bronze{color:#96602F} .rankname.none{color:var(--ink-dim)}
  .headline{font-size:17px;color:var(--ink);margin:6px 0 0}
  .plainstats{display:flex;flex-direction:column;gap:9px;margin-top:16px}
  .plainstat{display:flex;gap:10px;align-items:baseline;font-size:15px;color:var(--ink-dim)}
  .plainstat b{font-family:var(--display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;min-width:2.4ch}
  .stats{display:flex;gap:20px;flex-wrap:wrap}
  .stat b{display:block;font-family:var(--display);font-size:25px;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}

  .scorecard{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  .scorecard th{
    text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:500;padding:0 8px 7px 0;border-bottom:1px solid var(--edge);
  }
  .scorecard td{padding:9px 8px 9px 0;border-bottom:1px solid rgba(58,52,44,.5)}
  .scorecard td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .won{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
  .won.you{background:var(--you-soft);color:var(--you)}
  .won.them{background:var(--them-soft);color:#9A4A26}
  .won.split{background:var(--raised);color:var(--ink-faint)}

  .trade{border:1px solid var(--edge);border-radius:10px;padding:12px 14px;background:var(--raised)}
  .trade .line{display:flex;gap:9px;align-items:baseline;font-size:14px;margin-bottom:4px}
  .trade .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;width:36px;flex:none}
  .trade .tag.give{color:var(--them)} .trade .tag.take{color:var(--you)}
  .trade s{color:var(--ink-faint)}
  .trade .gain{font-size:12px;color:var(--good);margin-top:6px;font-variant-numeric:tabular-nums}

  .lesson{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid rgba(58,52,44,.5)}
  .lesson:last-child{border-bottom:0}
  .lesson .mark{font-family:var(--display);font-weight:700;font-size:16px;text-align:center}
  .lesson h4{margin:0 0 3px;font-size:15px}
  .lesson p{margin:0;color:var(--ink-dim);font-size:14px}
  .lesson.critical .mark,.lesson.critical h4{color:var(--bad)}
  .lesson.major .mark,.lesson.major h4{color:var(--them)}
  .lesson.minor .mark{color:var(--ink-dim)}
  .lesson.good .mark,.lesson.good h4{color:var(--good)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-dim);margin-top:8px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:5px;vertical-align:middle}

  .modal-back{position:fixed;inset:0;background:rgba(40,34,26,.40);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .18s}
  .modal{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:22px;max-width:min(94vw,440px);box-shadow:0 20px 60px rgba(40,34,26,.26)}
  .modal h3{font-size:19px;margin-bottom:8px}
  .tip{
    position:absolute;z-index:200;max-width:min(88vw,330px);
    background:var(--ink);color:#F7F4ED;border-radius:10px;padding:11px 13px;

/* ======================================================================
   1. Seeded randomness, so any deal can be replayed exactly.
   ====================================================================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rngFrom(seed){const r=mulberry32(seed);return{
  next:r,
  int:(lo,hi)=>lo+Math.floor(r()*(hi-lo+1)),
  pick:a=>a[Math.floor(r()*a.length)],
  chance:p=>r()<p,
  shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
}}

];
const SUFFIX=["Industries","Group","Holdings","Retail","Partners","Brands"];
const BUYER_CO=["Northwind","Cobalt Row","Harrow & Vale","Meridian","Fairweather","Bright Harbor","Kestrel","Ironwood","Tallgrass","Lumen","Redpoint"];
const SELLER_CO=["Castellan","Orsini","Pelham Works","Brightside","Aldergate","Voss & Sons","Quarry Lane","Marchetti","Stonefield","Halcyon"];

/* ======================================================================
   3. The scenario. Both sides top out at 100. Price is a pure tug of war;
   the other four issues are weighted very differently for each side, and
   that asymmetry is the whole game.
   ====================================================================== */
const money=n=>n>=1000?"$"+n.toLocaleString(undefined,{maximumFractionDigits:0}):"$"+n.toFixed(2);
const commas=n=>n.toLocaleString();
function ladder(top,steps){const o=[];for(let i=0;i<steps;i++)o.push(Math.round(top*(steps-1-i)/(steps-1)));return o}
function splitWeight(total,parts,lo,hi,rng){
  const c=[];for(let i=0;i<parts;i++)c.push(rng.int(lo,hi));
  let drift=total-c.reduce((a,b)=>a+b,0),guard=0;
  while(drift!==0&&guard++<800){const i=rng.int(0,parts-1),s=drift>0?1:-1;
    if(c[i]+s>=lo&&c[i]+s<=hi){c[i]+=s;drift-=s}}
  return c;
}
function softIssue(key,label,labels,youTop,themTop){
  const y=ladder(youTop,labels.length), t=ladder(themTop,labels.length).slice().reverse();
  return{key,label,options:labels.map((l,i)=>({key:key+i,label:l,you:y[i],them:t[i]}))};
}
function buildScenario(seed){
  const rng=rngFrom(seed), product=rng.pick(CATALOG);
  const buyerCo=rng.pick(BUYER_CO)+" "+rng.pick(SUFFIX);
  const sellerCo=rng.pick(SELLER_CO)+" "+product.firm;
  const priceW=rng.pick([28,30,32]), buyerVol=rng.int(3,7), sellerVol=rng.int(30,38);
  const soft=rng.shuffle(splitWeight(100-priceW-buyerVol,3,14,32,rng));
  const theirSoft=rng.shuffle(splitWeight(100-priceW-sellerVol,3,3,17,rng));
  const mult=[0.86,0.93,1.00,1.08,1.16];
  const prices=mult.map(m=>product.price>=100?Math.round(product.price*m):Math.round(product.price*m*100)/100);
  const pb=ladder(priceW,5);
  const issues=[
    {key:"price",label:"Price per "+product.unit,options:prices.map((p,i)=>({key:String(p),label:money(p),raw:p,you:pb[i],them:priceW-pb[i]}))},
    {key:"volume",label:"Volume commitment",options:product.vols.map((v,i)=>({key:String(v),label:commas(v)+" "+product.units,raw:v,
      you:ladder(buyerVol,4)[i],them:ladder(sellerVol,4).slice().reverse()[i]}))},
    softIssue("payment","Payment terms",["Net 90","Net 60","Net 30","Net 15"],soft[0],theirSoft[0]),
    softIssue("delivery","Delivery window",["2 weeks","4 weeks","8 weeks","12 weeks"],soft[1],theirSoft[1]),
    softIssue("exclusivity","Exclusivity",["Global, 2 yrs","Region, 2 yrs","Region, 1 yr","None"],soft[2],theirSoft[2])
  ];
  const midVol=product.vols[2];
  const sc={product,buyerCo,sellerCo,issues,seed,
    subject:`${product.item} \u2014 a year's supply`,
    dealLine:`You are buying <b>${product.item}</b> from ${sellerCo}, on a one-year supply contract worth roughly ${money(product.price*midVol)} a year.`,
    buyerRole:"Head of Procurement, "+buyerCo, sellerRole:"VP of Sales, "+sellerCo};
  setWalkaways(sc,rng);
  return sc;
}
function allPackages(sc){
  if(sc._all)return sc._all;
  const out=[];
  const walk=(i,picks,you,them)=>{
    if(i===sc.issues.length){out.push({picks:picks.slice(),you,them});return}
    for(const o of sc.issues[i].options){picks.push(o.key);walk(i+1,picks,you+o.you,them+o.them);picks.pop()}
  };
  walk(0,[],0,0);sc._all=out;return out;
}
const optionOf=(iss,k)=>iss.options.find(o=>o.key===k);
const scoreOf=(sc,picks)=>{let you=0,them=0;sc.issues.forEach((iss,i)=>{const o=optionOf(iss,picks[i]);you+=o.you;them+=o.them});return{you,them}};
const stakeYou=i=>Math.max(...i.options.map(o=>o.you))-Math.min(...i.options.map(o=>o.you));
const stakeThem=i=>Math.max(...i.options.map(o=>o.them))-Math.min(...i.options.map(o=>o.them));
function setWalkaways(sc,rng){
  const all=allPackages(sc), tilt=rng.int(-3,3);let chosen=[40,40];
  for(let base=60;base>=25;base--){
    const b=base+tilt,s=base-tilt;
    const frac=all.filter(p=>p.you>=b&&p.them>=s).length/all.length;
    if(frac>=0.10&&frac<=0.30){chosen=[b,s];break}
    if(frac>0.30){chosen=[b,s];break}
  }
  sc.buyerWalk=chosen[0];sc.sellerWalk=chosen[1];
}
const viablePackages=sc=>allPackages(sc).filter(p=>p.you>=sc.buyerWalk&&p.them>=sc.sellerWalk);
const maxJoint=sc=>Math.max(...allPackages(sc).map(p=>p.you+p.them));
function frontier(sc){
  if(sc._front)return sc._front;
  const all=allPackages(sc).slice().sort((a,b)=>b.you-a.you||b.them-a.them);
  const out=[];let best=-1;
  for(const p of all)if(p.them>best){out.push(p);best=p.them}
  sc._front=out;return out;
}
const contractValue=(sc,p)=>optionOf(sc.issues[0],p[0]).raw*optionOf(sc.issues[1],p[1]).raw;

const luminance=h=>{const n=parseInt(h.slice(1),16);return 0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255)};
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,Math.min(255,(n>>16)+amt)), g=Math.max(0,Math.min(255,((n>>8)&255)+amt)), b=Math.max(0,Math.min(255,(n&255)+amt));
  return"#"+((r<<16)|(g<<8)|b).toString(16).padStart(6,"0");
}

    hair=clear.length?rng.pick(clear):(luminance(skin)>120?"#15110F":"#DCC894");
  }
  if(persona.style==="heritage"&&rng.chance(0.6))hair=rng.pick(["#8E8B85","#CFCBC4","#B8B4AC"]);
  return{
    name:rng.pick(FIRST)+" "+rng.pick(LAST),
    title:"VP of Sales",company,persona,
    look:{skin,hair,cut:rng.pick(w.cuts),coat:rng.pick(w.coats),shirt:rng.pick(w.shirts),
      hairstyle:rng.pick(w.hairs),facial:rng.pick(w.facial),eyewear:rng.pick(w.eyewear),
      prop:rng.pick(w.props),
      jaw:rng.pick(["round","square","narrow"])}
  };
}

function hairSVG(l){
  const c=l.hair, hi=shade(c,26), back=[], front=[];
  const cap=(cy,ry,rx)=>`<ellipse cx="110" cy="${cy}" rx="${rx||52}" ry="${ry}" fill="${c}" clip-path="url(#hc)"/>`;
  switch(l.hairstyle){
    case"buzz":front.push(cap(62,34));break;
    case"crop":front.push(cap(60,36));break;
    case"short":front.push(cap(58,38));break;
    case"fade":
      front.push(cap(56,36));
      front.push(`<rect x="58" y="86" width="104" height="14" fill="${shade(c,-18)}" opacity=".5" clip-path="url(#hc)"/>`);break;
    case"undercut":
      front.push(cap(54,34));
      front.push(`<rect x="58" y="80" width="104" height="22" fill="${shade(c,-30)}" clip-path="url(#hc)"/>`);break;
    case"slick":
      front.push(cap(58,37));
      for(let i=0;i<5;i++)front.push(`<path d="M ${74+i*18} 40 Q ${80+i*18} 62 ${72+i*18} 76" stroke="${hi}" stroke-width="2" fill="none" opacity=".55" clip-path="url(#hc)"/>`);break;
    case"parted":
      front.push(cap(58,37));
      front.push(`<path d="M 126 26 L 120 82" stroke="${shade(c,-40)}" stroke-width="3.5" clip-path="url(#hc)"/>`);break;
    case"receding":
      front.push(`<ellipse cx="76" cy="62" rx="22" ry="26" fill="${c}" clip-path="url(#hc)"/>`,
                 `<ellipse cx="144" cy="62" rx="22" ry="26" fill="${c}" clip-path="url(#hc)"/>`);break;
    case"grey":
      front.push(cap(58,37));
      front.push(`<ellipse cx="110" cy="52" rx="44" ry="20" fill="${shade(c,30)}" opacity=".5" clip-path="url(#hc)"/>`);break;
    case"curls":
      front.push(cap(60,38));
      for(let i=0;i<8;i++)front.push(`<circle cx="${64+i*13}" cy="${i%2?52:58}" r="12" fill="${i%2?hi:c}"/>`);break;
    case"waves":
      front.push(cap(58,37));
      for(let i=0;i<4;i++)front.push(`<path d="M 66 ${52+i*9} Q 110 ${44+i*9} 154 ${52+i*9}" stroke="${hi}" stroke-width="2.4" fill="none" opacity=".5" clip-path="url(#hc)"/>`);break;
    case"messy":
      front.push(cap(58,38));
      for(let i=0;i<7;i++)front.push(`<path d="M ${68+i*13} ${34+(i%2?3:0)} q ${i%2?9:-9} -7 ${i%2?4:-4} -12"

    case"long":
      back.push(`<path d="M 56 70 Q 50 190 78 214 L 142 214 Q 170 190 164 70 Z" fill="${c}"/>`);
      front.push(cap(60,38));break;
    case"bun":
      back.push(`<circle cx="110" cy="26" r="17" fill="${c}"/>`);front.push(cap(58,37));break;
    default:front.push(cap(58,38));
  }
  return{back:back.join(""),front:front.join("")};
}
function facialSVG(l){

function eyewearSVG(l){

/* Clothing. The cut is chosen by personality, so it reads as a signal.

      s+=`<path d="M 101 191 L 110 197 L 119 191" fill="none" stroke="${shade(coat,-58)}" stroke-width="1.6"/>`;

  } else if(cut==="quarterzip"){
    s+=`<path d="M 96 167 L 110 190 L 124 167 L 132 172 L 118 200 L 102 200 L 88 172 Z" fill="${shirt}"/>`;

function fxSVG(kind){

function personSVG(ch,mood){
  const l=ch.look, m=MOODS[mood]||MOODS.neutral;
  const head=HEAD_PATHS[l.jaw]||HEAD_PATHS.round, hair=hairSVG(l);
  const cheek=shade(l.skin,-20), line=shade(l.skin,-34);

    ? `<g stroke="${line}" stroke-width="1.5" fill="none" opacity=".5" stroke-linecap="round">
         <path d="M 74 88 q 6 -4 12 -2"/><path d="M 146 88 q -6 -4 -12 -2"/>
         <path d="M 88 124 q 6 12 2 20"/><path d="M 132 124 q -6 12 -2 20"/></g>` : "";
  return `
  <defs><clipPath id="hc"><path d="${head}"/></clipPath></defs>
  <g id="fig-back">${hair.back}</g>
  <path d="M 94 140 L 126 140 L 126 180 L 94 180 Z" fill="${shade(l.skin,-30)}"/>
  <path d="M 94 140 L 126 140 L 126 152 Q 110 162 94 152 Z" fill="${shade(l.skin,-52)}"/>
  <g id="fig-body">${torsoSVG(l)}${propSVG(l)}</g>
  <g id="fig-head">
    <g><ellipse cx="59" cy="102" rx="9.5" ry="14" fill="${l.skin}"/>
       <path d="M 58 96 q 5 6 0 12" stroke="${shade(l.skin,-40)}" stroke-width="2" fill="none" stroke-linecap="round"/></g>
    <g><ellipse cx="161" cy="102" rx="9.5" ry="14" fill="${l.skin}"/>
       <path d="M 162 96 q -5 6 0 12" stroke="${shade(l.skin,-40)}" stroke-width="2" fill="none" stroke-linecap="round"/></g>
    <path d="${head}" fill="${l.skin}"/>
    <path d="M 110 32 C 82 32 62 55 62 90 C 62 120 71 143 88 152 C 95 157 102 160 110 160 Z" fill="${shade(l.skin,-16)}" opacity=".32"/>
    <ellipse cx="82" cy="118" rx="12" ry="7" fill="${cheek}" opacity=".3"/>
    <ellipse cx="138" cy="118" rx="12" ry="7" fill="${cheek}" opacity=".3"/>
    ${aged}
    ${hair.front}
    <g id="fig-flush"></g>
    <g id="fig-brows"></g>
    <g id="fig-eyes"></g>
    ${noseSVG(l.nose,l.skin)}
    <g id="fig-mouth"></g>
    ${facialSVG(l)}
    ${eyewearSVG(l)}
  </g>
  <g id="fig-fx"></g>`;
}
/* Only these three groups change when the mood changes, so the breathing,
   blinking and fidgeting animations underneath are never interrupted. */
function faceParts(ch,mood){
  const l=ch.look, m=MOODS[mood]||MOODS.neutral, pose=BROWS[m.brow], bs=browShape(l.brow);
  const lip=shade(l.skin,-78);
  const brow=(cx,dir)=>`<g transform="translate(${cx} ${78+pose.y}) rotate(${pose.rot*dir})">
    <path d="${bs.d}" stroke="${shade(l.hair,10)}" stroke-width="${bs.w}" fill="none" stroke-linecap="round"/></g>`;
  return{
    brows:brow(90,1)+brow(130,-1),
    eyes:eyeSVG(m.eye,90,-1,l.iris)+eyeSVG(m.eye,130,1,l.iris),
    mouth:MOUTHS[m.mouth].replace(/INK/g,lip),
    fx:fxSVG(m.fx)
  };
}

/* Most meetings happen in daylight. Occasionally you catch someone at the
   end of a very long day, and the room tells you so before they do. */
const TIMES={
  morning:{shift:14,warm:"#FFF6E2",alpha:.16,night:false,label:"Mid-morning."},
  day:{shift:0,warm:"#FFFBF0",alpha:.10,night:false,label:"Early afternoon."},
  golden:{shift:-16,warm:"#FFC98A",alpha:.26,night:false,label:"Late afternoon; the light has gone orange."},
  evening:{shift:-92,warm:"#FFCE8E",alpha:.20,night:true,label:"After hours. They have been here a while."}
};
function pickTime(rng,room){
  const r=rng.next();
  if(room==="grind"&&r<0.34)return"evening";
  if(r<0.42)return"morning";
  if(r<0.76)return"day";
  if(r<0.92)return"golden";
  return"evening";
}
const W=960,H=470,DESK_Y=372;

function skylineSVG(rng,x,y,w,h,night){
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${night?"#11151F":"#BFD9EC"}"/>`;
  if(!night){
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${h*0.62}" fill="#9FC6E4"/>`;
    for(let i=0;i<3;i++)s+=`<ellipse cx="${x+40+i*Math.round(w/3)}" cy="${y+22+(i%2)*16}" rx="${34+i*7}" ry="13" fill="#FFFFFF" opacity=".72"/>`;
  }
  let cx=x;
  while(cx<x+w){
    const bw=rng.int(22,46), bh=rng.int(Math.round(h*0.3),Math.round(h*0.88));
    const by=y+h-bh;
    s+=`<rect x="${cx}" y="${by}" width="${bw}" height="${bh}" fill="${night?"#1B2130":"#8FA9BE"}"/>`;
    if(!night)s+=`<rect x="${cx}" y="${by}" width="${Math.round(bw*0.35)}" height="${bh}" fill="#A6BCCE"/>`;
    for(let wy=by+6;wy<y+h-6;wy+=11)
      for(let wx=cx+4;wx<cx+bw-5;wx+=9)
        if(rng.chance(night?0.42:0.22))
          s+=`<rect x="${wx}" y="${wy}" width="4" height="5" fill="${night?"#E8C88A":"#6A88A0"}" opacity="${night?0.9:0.55}"/>`;
    cx+=bw+rng.int(3,10);
  }
  return s;
}
function windowSVG(kind,rng,night){
  if(kind==="none")return"";
  const x=556,y=44,w=334,h=202;
  const frame=`<rect x="${x-8}" y="${y-8}" width="${w+16}" height="${h+16}" rx="4" fill="#8E8778"/>`;
  let inner="";
  if(kind==="skyline")inner=skylineSVG(rng,x,y,w,h,night);
  else if(kind==="glass"){
    inner=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${night?"#1A2029":"#AFD0E8"}"/>`+
      skylineSVG(rng,x,y+h*0.35,w,h*0.65,night);
  } else if(kind==="brick"){
    inner=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${night?"#2A1C18":"#9C5A44"}"/>`;
    for(let r=0;r<Math.ceil(h/17);r++)
      for(let c=-1;c<Math.ceil(w/40);c++)
        inner+=`<rect x="${x+c*40+(r%2?20:0)}" y="${y+r*17}" width="37" height="14" fill="${night?"#36241E":"#AE6A50"}"/>`;
    inner+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#000" opacity="${night?.3:.06}"/>`;
    for(let i=0;i<3;i++)inner+=`<rect x="${x+26+i*106}" y="${y+46}" width="58" height="108" rx="3" fill="${night?"#10131A":"#7FA3BE"}" stroke="${night?"#241812":"#6E4436"}" stroke-width="4"/>`;
  } else if(kind==="industrial"){
    inner=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${night?"#171B20":"#BBD5E8"}"/>`;
    for(let i=1;i<6;i++)inner+=`<rect x="${x+i*(w/6)-2}" y="${y}" width="4" height="${h}" fill="#15130F"/>`;
    for(let i=1;i<3;i++)inner+=`<rect x="${x}" y="${y+i*(h/3)-2}" width="${w}" height="4" fill="#15130F"/>`;
  } else if(kind==="sash"){
    inner=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${night?"#161A1F":"#A9C89C"}"/>`;
    inner+=`<rect x="${x+w/2-3}" y="${y}" width="6" height="${h}" fill="#241C15"/>`;
    inner+=`<rect x="${x}" y="${y+h/2-3}" width="${w}" height="6" fill="#241C15"/>`;
  } else if(kind==="blinds"){
    inner=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${night?"#1A1D18":"#C6DCEC"}"/>`;
    for(let i=0;i<14;i++)inner+=`<rect x="${x}" y="${y+i*15}" width="${w}" height="9" fill="#EFEEE2" opacity=".88"/>`;
  }
  const glow=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#winglow)" opacity=".5"/>`;
  return frame+inner+glow+`<rect x="${x-8}" y="${y-8}" width="${w+16}" height="${h+16}" rx="4" fill="none" stroke="#6E675B" stroke-width="3"/>`;
}

function eastereggSVG(ch,rng,floorY){
  // A flag on the wall is a once-in-a-while thing, not office furniture.
  if(rng.chance(0.02)){
    const spot=EGG_SPOTS[Math.floor(rng.next()*EGG_SPOTS.length)];
    return `<g class="egg" data-egg="vietnam">${EGGS.vietnam.draw(spot[0],spot[1])}</g>`;
  }
  if(!rng.chance(0.45))return"";            // most rooms have nothing odd in them
  const pool=EGG_POOL[ch.persona.key]||[];
  const key=pool[Math.floor(rng.next()*pool.length)];
  const egg=EGGS[key];
  if(!egg)return"";
  const spot=EGG_SPOTS[Math.floor(rng.next()*EGG_SPOTS.length)];
  return `<g class="egg" data-egg="${key}">${egg.draw(spot[0],spot[1])}</g>`;
}

function officeSVG(ch,seed){

  else if(rightProp==="plantDying")props+=PROPS.plantDying(716,floorY);
  else if(rightProp==="trophy")props+=PROPS.trophy(720,floorY);
  else if(rightProp==="frames")props+=PROPS.frames(700,300,rng);
  const eggs=eastereggSVG(ch,rng,floorY);
  const shaft=night?"":`<path d="M 556 44 L 890 44 L 700 ${H} L 300 ${H} Z" fill="${t.warm}" opacity="${t.alpha}"/>`;
  return `
  <defs>
    <linearGradient id="winglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${o.light}" stop-opacity="${night?.30:.16}"/>

      <stop offset="1" stop-color="${t.warm}" stop-opacity="0"/>

  <rect width="${W}" height="${H}" fill="url(#wallg)"/>
  <rect y="${H-120}" width="${W}" height="120" fill="${o.floor}"/>

/* ----------------------------------------------------------------------
   Tension. Not a bar -- you read it off their face. It climbs when you
   lowball them, insult them or burn the clock, and it falls when a deal
   gets close or you are decent to them. High tension flushes the skin,
   beads sweat and hardens whatever expression they were already wearing.
   ---------------------------------------------------------------------- */
function bumpTension(n){
  if(!G)return;
  G.tension=Math.max(0,Math.min(100,(G.tension||0)+n));
  paintTension();
}
function tensionLevel(){
  const t=G?G.tension||0:0;
  return t>=78?"boiling":t>=54?"hot":t>=30?"warm":"cool";
}
function paintTension(){
  const el=document.getElementById("fig-flush");
  if(!el||!G)return;
  const t=G.tension||0, skin=G.ch.look.skin;
  // Blood goes to the cheeks and the ears first, not evenly over the face.
  const flush=Math.min(.34,t/100*.38);
  let out=`<ellipse cx="110" cy="116" rx="50" ry="56" fill="#C23B22" opacity="${(flush*0.42).toFixed(3)}" clip-path="url(#hc)"/>`
    +`<ellipse cx="82" cy="118" rx="19" ry="12" fill="#BE3A22" opacity="${flush.toFixed(3)}" clip-path="url(#hc)"/>`
    +`<ellipse cx="138" cy="118" rx="19" ry="12" fill="#BE3A22" opacity="${flush.toFixed(3)}" clip-path="url(#hc)"/>`
    +`<ellipse cx="110" cy="152" rx="26" ry="12" fill="#BE3A22" opacity="${(flush*0.7).toFixed(3)}" clip-path="url(#hc)"/>`;
  if(t>=44)out+=`<ellipse cx="59" cy="102" rx="9.5" ry="14" fill="#BE3A22" opacity="${(flush*0.8).toFixed(3)}"/>
                 <ellipse cx="161" cy="102" rx="9.5" ry="14" fill="#BE3A22" opacity="${(flush*0.8).toFixed(3)}"/>`;
  if(t>=62)out+=`<path d="M 150 62 q 7 13 0 19 q -7 -6 0 -19 Z" fill="#7FB6D6" opacity=".85"/>`;
  if(t>=78)out+=`<g stroke="#8E2A1C" stroke-width="2.4" fill="none" opacity=".7" stroke-linecap="round">
      <path d="M 70 54 l 7 7 l -7 6"/><path d="M 78 52 l 7 7 l -7 6"/></g>`;
  el.innerHTML=out;
}
/* Tension colours which face they pull, not just how red it is. */
function tensionMood(base){
  const lvl=tensionLevel();
  if(lvl==="boiling"&&(base==="annoyed"||base==="thinking"))return"angry";
  if(lvl==="hot"&&base==="thinking")return"annoyed";
  if(lvl==="cool"&&base==="annoyed")return"thinking";
  return base;
}

/* ---- where they are looking ----------------------------------------
   Gaze is the loudest thing on a face. It drifts while they think, drops
   to the paper when an offer lands, slides away when they are being less
   than straight with you, and locks onto you when they mean it. */
const GAZE={
  you:[0,0], paper:[0,3.4], away:[-3.6,-1], calc:[2.6,-2.2],
  ceiling:[0,-3.4], down:[0,3.8]
};
function setGaze(where,holdMs){
  if(!G)return;
  G.gaze=GAZE[where]||GAZE.you;
  applyGaze();
  if(holdMs){
    clearTimeout(G.gazeTimer);
    G.gazeTimer=setTimeout(()=>{G.gaze=GAZE.you;applyGaze()},holdMs);
  }
}
function applyGaze(){
  const [x,y]=G&&G.gaze?G.gaze:[0,0];

/* ---- idle life: breathing, blinking, the occasional shrug or glance ---- */
let idleTimers=[];
function stopIdle(){idleTimers.forEach(clearTimeout);idleTimers=[]}
function startIdle(){
  stopIdle();
  if(reduced()||!SETTINGS.motion)return;
  const blink=()=>{
    const eyes=document.getElementById("fig-eyes");
    if(eyes&&G&&!BLINKLESS.has(G.mood)){
      const keep=eyes.innerHTML;
      eyes.innerHTML=eyeSVG("closed",90,-1)+eyeSVG("closed",130,1);
      idleTimers.push(setTimeout(()=>{if(eyes.isConnected)eyes.innerHTML=keep},120));
    }
    idleTimers.push(setTimeout(blink,1800+Math.random()*4200));
  };
  const drift=()=>{
    if(G&&!G.gazeLocked){
      const spots=["you","you","away","calc","ceiling"];
      G.gaze=GAZE[spots[Math.floor(Math.random()*spots.length)]];
      applyGaze();
    }
    idleTimers.push(setTimeout(drift,2600+Math.random()*3600));
  };
  const fidget=()=>{
    const fig=document.getElementById("figure");
    if(fig){
      const move=Math.random()<0.5?"shrug":"glance";
      fig.classList.add(move);
      idleTimers.push(setTimeout(()=>fig.classList.remove(move),900));
    }
    idleTimers.push(setTimeout(fidget,5000+Math.random()*7000));
  };

/* ======================================================================
   7. The seller's decision making. The rules decide everything that
   matters; dialogue only supplies the words.
   ====================================================================== */
function makeSeller(sc,persona,rounds,rng){
  const all=allPackages(sc), importance={};
  sc.issues.forEach(i=>importance[i.key]=1);
  return{
    persona,rounds,rng,insults:0,lastPlayer:null,lastCounter:null,importance,
    target(round){
      const floor=sc.sellerWalk+3;
      if(rounds<=1)return floor;
      const p=Math.min(1,(round-1)/(rounds-1)*persona.rate);
      return Math.round(persona.open-(persona.open-floor)*p);
    },
    guess(picks){
      let t=0;
      sc.issues.forEach((iss,i)=>{
        const idx=iss.options.findIndex(o=>o.key===picks[i]);
        t+=importance[iss.key]*((iss.options.length-1-idx)/(iss.options.length-1));
      });
      return t;
    },
    observe(picks){
      sc.issues.forEach((iss,i)=>{
        const idx=iss.options.findIndex(o=>o.key===picks[i]);
        if(!this.lastPlayer){if(idx===0)importance[iss.key]+=0.4;return}
        const was=iss.options.findIndex(o=>o.key===this.lastPlayer[i]);
        if(idx>was)importance[iss.key]=Math.max(0.4,importance[iss.key]-0.6);
        else if(idx===was&&idx<=1)importance[iss.key]+=0.8;
      });
      this.lastPlayer=picks.slice();
    },
    nudge(k,d){importance[k]=Math.max(0.3,importance[k]+d)},
    pick(min,ceiling){
      let pool=all.filter(p=>p.them>=min);
      if(ceiling!=null){const t=pool.filter(p=>p.them<=ceiling);if(t.length)pool=t}
      if(!pool.length)pool=[all.reduce((a,b)=>b.them>a.them?b:a)];
      let best=pool[0],bg=-1;
      for(const p of pool){const g=this.guess(p.picks);if(g>bg||(g===bg&&p.them<best.them)){best=p;bg=g}}
      return best;
    },
    advance(target){
      const ceiling=this.lastCounter?this.lastCounter.them:null;
      let c=this.pick(target,ceiling);
      if(this.lastCounter&&this.guess(c.picks)<this.guess(this.lastCounter.picks))c=this.lastCounter;
      this.lastCounter=c;return c;
    },
    opening(){this.lastCounter=this.pick(persona.open,persona.open+6);return this.lastCounter},
    insultLevel(them){
      const gap=sc.sellerWalk-them;
      if(gap<persona.margin)return 0;
      return gap>=persona.margin*2?2:1;
    },
    respond(picks,round){
      this.observe(picks);
      const mine=scoreOf(sc,picks).them, target=this.target(round), final=round>=rounds;
      if(mine>=persona.delight)return{kind:"accept",mood:"delight"};
      const sev=this.insultLevel(mine);
      if(sev){
        this.insults+=sev;
        if(this.insults>persona.patience)return{kind:"rage",mood:"rage"};
        if(!final)return{kind:"counter",offer:this.advance(target),mood:"insult"};
      }
      if(mine>=target)return{kind:"accept",mood:"accept"};
      if(final)return mine>=sc.sellerWalk?{kind:"accept",mood:"thin"}:{kind:"nodeal",mood:"walk"};
      return{kind:"counter",offer:this.advance(target),mood:mine<sc.sellerWalk?"below":"close"};
    },
    hint(){
      const r=sc.issues.slice().sort((a,b)=>stakeThem(b)-stakeThem(a));
      if(rng.chance(persona.honesty))
        return `${r[0].label} decides whether this is worth doing for me, with ${r[1].label.toLowerCase()} behind it. ${r[r.length-1].label} I have more room on than you'd think.`;
      return `${r[1].label} is what I'm measured on this quarter, so that's where I'm least flexible. Everything else I can look at.`;
    }
  };
}

const INTENTS=[
  ["priorities",[/\bwhat (do you|matters|are you|would you)\b/,/\bmost important\b/,/\bpriorit/,/\bcare (most )?about\b/,/\bwhat.*\bneed\b/,/\bwhich.*\bmatter/,/\bdriving\b/]],
  ["why",[/\bwhy\b/,/\bjustify\b/,/\bexplain\b/,/\bhow come\b/,/\bon what basis\b/]],
  ["threat",[/\bwalk (away|out)\b/,/\bleave the table\b/,/\bno deal\b/,/\banother supplier\b/,/\bcompetitor\b/,/\bgo elsewhere\b/,/\bfind someone else\b/]],
  ["insult",[/\bridiculous\b/,/\bjoke\b/,/\binsult/,/\bpathetic\b/,/\bwaste of\b/,/\bclown\b/,/\bnonsense\b/,/\brobbery\b/,/\bripping me off\b/,/\bgreedy\b/]],
  ["trade",[/\bif you\b.*\bi(')?ll\b/,/\bin (exchange|return)\b/,/\btrade\b/,/\bgive you\b/,/\bswap\b/,/\bi can (give|offer|do)\b/,/\bwould you take\b/,/\bhow about\b/]],
  ["flexible",[/\bflexible\b/,/\bdon'?t (really )?care about\b/,/\bnot (that )?important to (me|us)\b/,/\bhappy to move\b/,/\bcan live with\b/,/\bopen to\b/]],
  ["deadline",[/\bhurry\b/,/\bquick/,/\bclose (this|it) (out|today)\b/,/\bwrap (this )?up\b/,/\brunning out\b/]],
  ["flatter",[/\brespect\b/,/\bappreciate\b/,/\bfair enough\b/,/\bpleasure\b/,/\bthank you\b/,/\bthanks\b/,/\bimpress/,/\bgood point\b/]],
  ["small",[/\bhow are you\b/,/\bweekend\b/,/\bweather\b/,/\bcoffee\b/,/\bhello\b/,/\bhi\b/,/\bhey\b/,/\blunch\b/,/\bfamily\b/]]
];
const PRIORITY={threat:5,insult:5,trade:4,priorities:4,flexible:3,why:3,deadline:2,flatter:1,small:0};
function classify(text){
  const t=text.toLowerCase().trim();if(!t)return"none";
  let best="none",bs=0;
  for(const[name,pats]of INTENTS){
    const hits=pats.filter(p=>p.test(t)).length;
    if(hits&&(hits>bs||(hits===bs&&PRIORITY[name]>(PRIORITY[best]||-1)))){best=name;bs=hits}
  }
  return best;
}

  volume:["volume","units","quantity","commit","order size","annual"],

      ${row("Show their points","Reveals what each term is worth to them. Training wheels.","rv","Hide","Show",0,0,!SETTINGS.reveal)}
      ${row("Motion","Breathing, blinking, sliding paper and typed-out speech","mo","On","Off",0,0,SETTINGS.motion)}
    </div>
    <div class="modal-actions"><button class="btn primary" data-close>Done</button></div></div>`;
  document.body.appendChild(back);
  const close=()=>{back.remove();showMenu()};

    if(!act)return;

    if(a==="mob"){SETTINGS.motion=false;document.body.classList.add("nomotion")}
    back.remove();openSettings();
  });
}

/* ======================================================================
   The tutorial: a real deal against a patient opponent, with the game
   pointing at the right thing at the right moment. Nothing is faked --
   the same rules and the same maths apply.
   ====================================================================== */
const TUTORIAL_SEED=740115;

/* Chapters. The first few teach the idea with nothing on the line; the
   rest run alongside a real negotiation. `done` names the action that
   advances the step -- "read" means the player presses Next. */
const TUT_STEPS=[
 {hint:()=>`Welcome. You are the <b>buyer</b>. Somebody across the table is the <b>seller</b>, and you are going to argue about one contract for a few minutes.<br><br>Nothing here is jargon you need to know already \u2014 anything underlined, you can hover or tap for a plain explanation.`,done:"read"},
 {hint:()=>`You are buying <b>${esc(G.sc.product.item)}</b> from ${esc(G.sc.sellerCo)}. That part is fixed. What you argue about is the <b>five terms</b> of the contract: the price, how much you commit to buy, when you pay, how fast they deliver, and whether they can sell to your rivals.`,done:"read"},
 {hint:()=>`Every option on every term is worth some <b data-tip="points">points</b> to you. Getting your favourite option on all five would be 100.<br><br>You also have a <b data-tip="walkaway">walk-away</b> of ${G.sc.buyerWalk}. That is what you get for standing up and leaving. Sign for less than that and you have done worse than not signing at all.`,done:"read"},
 {hint:()=>{
    const r=G.sc.issues.slice().sort((a,b)=>stakeYou(b)-stakeYou(a));
    return `Here is the important part. <b>They have their own scoresheet and it is nothing like yours.</b><br><br>For you, ${esc(r[0].label.toLowerCase())} is the big one and ${esc(r[r.length-1].label.toLowerCase())} barely matters. For them it is the other way round on at least one term. Press <b>My brief</b> in the top bar to see your own list.`},done:"brief"},
 {hint:()=>`That gap is the whole game.<br><br><b>Sell them the thing that is cheap for you and dear to them. Keep the thing that is dear to you.</b> Do that and you both walk out better off than if you had just split every difference down the middle.`,done:"read"},
 {hint:()=>`So: find out what they want. Press <b>Ask what matters</b>. It is free and it does not use up a round \u2014 and most people never do it once.`,done:"asked"},
 {hint:()=>`Watch her eyes when she answers. Someone being straight with you looks at you; someone shading it glances away first.<br><br>Now hold her answer next to your own list. The term she just named \u2014 how many points is it worth to <i>you</i>?`,done:"read"},
 {hint:()=>`Time to build an offer. Press <b>Open the term sheet</b>.`,done:"opened"},
 {hint:()=>{
    const r=G.sc.issues.slice().sort((a,b)=>stakeYou(b)-stakeYou(a));
    return `Give her the option she wants on <b>${esc(r[r.length-1].label.toLowerCase())}</b> \u2014 it costs you only ${stakeYou(r[r.length-1])} points.<br><br>Then take your best option on <b>${esc(r[0].label.toLowerCase())}</b>, worth ${stakeYou(r[0])}. Watch the number at the bottom climb, then press <b>Send this offer</b>.`},done:"sent"},
 {hint:()=>`Now read her. Under the speech there is a line telling you exactly what she changed and whether it helped you.<br><br>And look at her face. The more you push her, the more she flushes. Push too hard and she will walk out for good.`,done:"read"},
 {hint:()=>`Keep going. Concede only where it is cheap for you, and make her pay for every step. Her demands fall as the clock runs down, so patience is worth something \u2014 but run out of rounds and you both get nothing.`,done:"read"},
 {hint:()=>`That is everything. Finish this deal however you like, and the scoreboard at the end will tell you what you missed and why.<br><br>Good luck. Most people lose this by fighting hardest over price, which is the one term where nobody can win.`,done:"read"}
];
function startTutorial(){
  newGame(TUTORIAL_SEED,true);
}
function tutAdvance(event){
  if(!G||!G.tutorial)return;
  const step=TUT_STEPS[G.tutStep];
  if(!step||step.done!==event)return;
  if(G.tutStep>=TUT_STEPS.length-1){
    G.tutorial=false;
    const b=document.getElementById("tutbar");if(b)b.remove();
    document.querySelectorAll(".pulse").forEach(e=>e.classList.remove("pulse"));
    setChrome("Negotiation",{restart:true,brief:true});
    return;
  }
  G.tutStep++;paintTutorial();
}
const TUT_TARGET={asked:"#ask",brief:"#briefbtn",opened:"#counter",sent:"#send"};
function paintTutorial(){
  const bar=document.getElementById("tutbar");
  if(!bar||!G.tutorial)return;
  const step=TUT_STEPS[G.tutStep], last=G.tutStep>=TUT_STEPS.length-1;
  bar.innerHTML=`
    <span class="step">${G.tutStep+1} / ${TUT_STEPS.length}</span>
    <div class="tutbody"><p>${step.hint()}</p>
      <div class="tutacts">
        ${step.done==="read"?`<button class="btn small primary" id="tutnext">${last?"Start negotiating":"Next"}</button>`:""}
        ${last?"":`<button class="btn small ghost" id="tutskip">Skip the lesson</button>`}
      </div></div>`;
  document.querySelectorAll(".pulse").forEach(e=>e.classList.remove("pulse"));
  const sel=TUT_TARGET[step.done];
  if(sel){const el=document.querySelector(sel);if(el)el.classList.add("pulse")}
  const nx=document.getElementById("tutnext");
  if(nx)nx.onclick=()=>tutAdvance("read");
  const sk=document.getElementById("tutskip");
  if(sk)sk.onclick=()=>{
    G.tutorial=false;
    document.querySelectorAll(".pulse").forEach(e=>e.classList.remove("pulse"));
    const b=document.getElementById("tutbar");if(b)b.remove();
    setChrome("Negotiation",{restart:true,brief:true});
  };
}


/* ======================================================================
   Plain English for every term the game uses. The real vocabulary stays
   on screen -- you should leave knowing it -- but nothing is ever more
   than a hover or a tap away from an explanation.
   ====================================================================== */
const GLOSSARY={
  price:{title:"Price per unit",
    plain:"What you pay for one of the things you're buying. Lower is better for you, higher is better for them. This is the one term where every point you win is a point they lose \u2014 there is no clever trade hiding in it."},
  volume:{title:"Volume commitment",
    plain:"How much you promise to buy over the year. Promising a lot is a risk for you \u2014 you're locked in whether you need it or not \u2014 but it is usually the single most valuable thing you can give a supplier, because it lets them plan their factory."},
  payment:{title:"Payment terms",
    plain:"How long you get to pay after the goods arrive. \u201cNet 90\u201d means you pay 90 days later. Longer is better for you because you keep your cash longer; shorter is better for them for exactly the same reason."},
  delivery:{title:"Delivery window",
    plain:"How long they take to deliver after you order. Also called lead time. Shorter is better for you \u2014 less waiting, less stock sitting in a warehouse."},
  exclusivity:{title:"Exclusivity",
    plain:"Whether they promise not to sell the same thing to your competitors, and where. Good for you because it keeps a rival from getting the same deal. Costly for them because it closes off customers they could otherwise sell to."},
  points:{title:"Points",
    plain:"A private score for how good a deal is <i>for you</i>. Every option is worth some points; getting your best option on all five terms would be 100. They have their own separate scoresheet and it is weighted differently, which is the whole game."},
  walkaway:{title:"Walk-away",
    plain:"The lowest score you should ever accept. Walking out with no deal is worth exactly this number. Sign anything below it and you have literally done worse than getting up and leaving."},
  stake:{title:"Points at stake",
    plain:"The gap between the best and worst option on this term. A big number means this term can swing your score a lot, so it is worth fighting for. A small number means you can give it away cheaply."},
  counter:{title:"Counter-offer",
    plain:"Your own version of the deal, sent back to them. You change whichever terms you like and send the whole package at once."},
  zopa:{title:"Where a deal is possible",
    plain:"Both of you have a floor. Any package that clears both floors is a deal you could both sign. Your job is to find one of those that is as far up your own scale as you can push it."}
};

/* A tooltip that works on hover and on tap, for anything carrying data-tip. */
let tipEl=null;
function hideTip(){if(tipEl){tipEl.remove();tipEl=null}}
function showTip(target){
  hideTip();
  const g=GLOSSARY[target.dataset.tip];
  if(!g)return;
  tipEl=document.createElement("div");
  tipEl.className="tip";
  tipEl.innerHTML=`<b>${esc(g.title)}</b><p>${g.plain}</p>`;
  document.body.appendChild(tipEl);
  const r=target.getBoundingClientRect(), t=tipEl.getBoundingClientRect();
  let left=r.left+r.width/2-t.width/2;
  left=Math.max(10,Math.min(left,window.innerWidth-t.width-10));
  let top=r.top-t.height-10;
  if(top<8)top=r.bottom+10;
  tipEl.style.left=left+"px";tipEl.style.top=(top+window.scrollY)+"px";
}
document.addEventListener("pointerover",e=>{
  const t=e.target.closest("[data-tip]");
  if(t)showTip(t);
});
document.addEventListener("pointerout",e=>{
  if(e.target.closest("[data-tip]"))hideTip();
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tip]");
  if(t){e.preventDefault();showTip(t)}else hideTip();
});
document.addEventListener("scroll",hideTip,true);

    <div class="modal-actions"><button class="btn primary" data-close>Got it</button></div></div>`;

async function leaveToMenu(){
  if(G&&!G.outcome&&G.started){
    const ok=await ask("Leave this deal?","Nothing is saved. The deal, the person and the office all go away.","Leave");
    if(!ok)return;
  }
  stopIdle();G=null;showMenu();
}
let G=null, typing=null;
const ROUNDS=8;
/* Player settings. Kept in memory only -- nothing is written to disk. */
const SETTINGS={explicit:true,motion:true,reveal:false};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function pickLine(p,k,rng){
  const pool=(SETTINGS.explicit&&p.lines["x_"+k])?p.lines["x_"+k]:(p.lines[k]||["..."]);
  if(pool.length<2)return pool[0];
  // Don't say the same thing twice running; people notice.
  const used=G&&G.heard?G.heard:null;
  const fresh=used?pool.filter(l=>!used.has(l)):pool;
  const line=rng.pick(fresh.length?fresh:pool);
  if(used){if(fresh.length<=1)used.clear();used.add(line)}
  return line;
}
const reduced=()=>window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function newGame(seed,tutorial){
  const s=seed??Math.floor(Math.random()*900000)+1000;
  const sc=buildScenario(s), rng=rngFrom(s^0x5f3a);
  // The tutorial always faces The Professional: patient, and honest when asked.
  const ch=makeCharacter(rng,sc.sellerCo,tutorial?PERSONAS.find(x=>x.key==="pro"):null);
  G={seed:s,sc,ch,rng,rounds:ROUNDS,round:1,
     seller:makeSeller(sc,ch.persona,ROUNDS,rng),
     theirs:null,draft:null,yours:null,mood:ch.persona.rest,
     said:"",note:"",outcome:null,drawerOpen:false,started:false,
     tutorial:!!tutorial,tutStep:0,heard:new Set(),tension:0,
     log:{asked:false,insults:0,warmth:0,revealed:[],offers:[]}};
  const opening=G.seller.opening();
  G.theirs=opening.picks.slice();G.draft=opening.picks.slice();
  showBrief();
}

      </div>

/* Dialogue types itself out, like a game. Click to skip. */
function speak(text,mood,note){
  G.said=text;G.note=note||"";
  if(mood)setMood(mood);
  const dl=document.getElementById("dl"), n=document.getElementById("note");
  const r=document.getElementById("round");
  if(r)r.textContent=`Round ${Math.min(G.round,G.rounds)} / ${G.rounds}`;
  if(n){n.innerHTML=G.note;n.hidden=!G.note}
  if(!dl)return;
  if(typing){clearTimeout(typing);typing=null}
  if(reduced()||!SETTINGS.motion){dl.textContent='"'+text+'"';dl.classList.remove("typing");return}
  /* Spoken, not pasted: one letter at a time, with a beat at every comma
     and a longer one at the end of a sentence. */
  const full='"'+text+'"';let i=0;
  dl.textContent="";dl.classList.add("typing");
  const step=()=>{
    i++;
    dl.textContent=full.slice(0,i);
    if(i>=full.length){typing=null;dl.classList.remove("typing");return}
    const ch=full[i-1];
    let wait=26+Math.random()*16;
    if(ch===","||ch===";"||ch===":")wait=180;
    else if(ch==="."||ch==="!"||ch==="?")wait=300;
    else if(ch==="-"||ch==="\u2014")wait=150;
    typing=setTimeout(step,wait);
  };
  typing=setTimeout(step,90);
}
function finishTyping(){
  if(!typing)return;
  clearTimeout(typing);typing=null;
  const dl=document.getElementById("dl");
  dl.textContent='"'+G.said+'"';dl.classList.remove("typing");
}
function setMood(mood){
  G.mood=mood;
  const parts=faceParts(G.ch,mood);
  const put=(id,html)=>{const el=document.getElementById(id);if(el)el.innerHTML=html};
  put("fig-brows",parts.brows);put("fig-eyes",parts.eyes);
  put("fig-mouth",parts.mouth);put("fig-fx",parts.fx);
  applyGaze();paintTension();
  const hands=document.getElementById("handsgrp");
  if(hands)hands.innerHTML=handsSVG(G.ch,mood);
}
/* Slide the term sheet across. "out" is you handing yours over, "in" is
   theirs coming back at you. */
function passPaper(dir){
  if(reduced()||!SETTINGS.motion)return;
  const el=document.getElementById("paper");
  if(!el)return;
  el.classList.remove("out","in");void el.getBoundingClientRect();
  el.classList.add(dir);
}
/* Leaning in when a deal is close, back when they are offended. Small,
   but it is what people actually do. */
function lean(dir){
  if(reduced()||!SETTINGS.motion)return;
  const fig=document.getElementById("figure");
  if(!fig)return;
  fig.classList.remove("leanin","leanback");void fig.offsetWidth;
  fig.classList.add(dir==="in"?"leanin":"leanback");
  setTimeout(()=>fig.classList.remove("leanin","leanback"),2200);
}
function react(mood,fx){
  setMood(mood);
  const scene=document.getElementById("scene");
  if(!scene)return;
  if(fx&&!reduced()&&SETTINGS.motion){
    scene.classList.remove("shake","pop","recoil");void scene.offsetWidth;scene.classList.add(fx);
  }
}

/* --------------------------------------------------------- dialogs */
function ask(title,body,okLabel){
  return new Promise(resolve=>{
    const back=document.createElement("div");back.className="modal-back";
    back.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h3>${esc(title)}</h3><p>${body}</p>
      <div class="modal-actions"><button class="btn" data-no>Go back</button>
        <button class="btn primary" data-yes>${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(back);
    const done=v=>{back.remove();document.removeEventListener("keydown",onKey);resolve(v)};
    const onKey=e=>{if(e.key==="Escape")done(false)};
    document.addEventListener("keydown",onKey);
    back.querySelector("[data-yes]").onclick=()=>done(true);
    back.querySelector("[data-no]").onclick=()=>done(false);
    back.addEventListener("click",e=>{if(e.target===back)done(false)});
    back.querySelector("[data-no]").focus();
  });
}

/* --------------------------------------------------------- actions */
async function sendOffer(){
  const {sc}=G, picks=G.draft.slice(), y=scoreOf(sc,picks);
  if(y.you<sc.buyerWalk){
    const ok=await ask("That offer is below your own floor",
      `This package is worth <b>${y.you}</b> to you. Your walk-away is <b>${sc.buyerWalk}</b>.
       If they sign it, you have done worse than not signing at all.`,"Send it anyway");
    if(!ok)return;
  }
  closeDrawer();
  tutAdvance("sent");
  passPaper("out");
  setGaze("paper",1500);
  G.yours=picks;G.log.offers.push(picks);
  const reply=G.seller.respond(picks,G.round), p=G.ch.persona;
  // How far under their floor you came in decides how much this costs you.
  const theirs=scoreOf(sc,picks).them, gap=sc.sellerWalk-theirs;
  bumpTension(gap>26?30:gap>12?18:gap>0?7:-14);
  if(G.round>=G.rounds-2)bumpTension(6);

  if(reply.kind==="accept"){
    const fleeced=reply.mood==="delight";
    react(fleeced?"delighted":reply.mood==="thin"?"smug":"pleased","pop");
    setGaze("you");lean("in");
    speak(pickLine(p,fleeced?"delight":reply.mood==="thin"?"thin":"accept",G.rng),null,
      fleeced?"They could not sign it fast enough. That is never a good sign.":"");
    return setTimeout(()=>finish("signed",picks,fleeced),2100);
  }
  if(reply.kind==="rage"){
    react("furious","shake");setGaze("you");lean("in");
    speak(pickLine(p,"rage",G.rng),null,
      "They shove the chair back, sweep the term sheet off the desk and walk out.");
    return setTimeout(()=>finish("raged",null,false),2600);
  }
  if(reply.kind==="nodeal"){
    react("angry","shake");
    speak(pickLine(p,"walk",G.rng),null,"");
    return setTimeout(()=>finish("theywalked",null,false),2200);
  }
  const explained=explainMove(G.theirs,reply.offer.picks);
  G.theirs=reply.offer.picks.slice();G.round++;
  setTimeout(()=>passPaper("in"),620);
  let mood=reply.mood==="insult"?"angry":reply.mood==="close"?"thinking":"annoyed";
  if(reply.mood==="close"&&tensionLevel()==="cool"&&G.rng.chance(.4))mood="laughing";
  mood=tensionMood(mood);
  react(mood,reply.mood==="insult"?"recoil":null);
  setGaze(reply.mood==="close"?"you":reply.mood==="insult"?"paper":"calc",2400);
  if(reply.mood==="close")lean("in");
  if(reply.mood==="insult")lean("back");
  speak(pickLine(p,reply.mood,G.rng),null,explained);
  if(G.round>G.rounds)setTimeout(()=>finish("timeout",null,false),2200);
}

/* Say what they actually did, in words, and whether it helped you. People
   should not have to diff two term sheets in their head. */
function explainMove(before,after){
  const sc=G.sc, moves=[];
  sc.issues.forEach((iss,i)=>{
    if(before[i]===after[i])return;
    const was=optionOf(iss,before[i]), now=optionOf(iss,after[i]);
    moves.push({label:iss.label.toLowerCase(),from:was.label,to:now.label,delta:now.you-was.you});
  });
  const net=scoreOf(sc,after).you-scoreOf(sc,before).you;
  if(!moves.length)
    return `They changed nothing. Their offer is still worth <b>${scoreOf(sc,after).you}</b> to you.`;
  const phrase=moves.map(m=>{
    const dir=m.delta>0?"your way":m.delta<0?"their way":"sideways";
    return `<b>${esc(m.label)}</b> from ${esc(m.from)} to ${esc(m.to)} (${dir})`;
  }).join(", and ");
  const verdict=net>0?`That leaves you <b>${net}</b> better off.`
              :net<0?`That leaves you <b>${-net}</b> worse off.`
              :`That leaves you exactly where you were.`;
  return `They moved ${phrase}. ${verdict} Their offer is now worth <b>${scoreOf(sc,after).you}</b> to you.`;
}

  if(!text)return;
  input.value="";
  const p=G.ch.persona, kind=classify(text), named=namedIssues(text,G.sc);
