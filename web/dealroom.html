<title>The Deal Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#12100E; --panel:#1C1916; --raised:#262219; --edge:#3A342C; --edge-lit:#544C40;
    --ink:#EDE6D9; --ink-dim:#A79E8E; --ink-faint:#6F675B;
    --you:#4EA8A0; --you-deep:#255B57; --them:#C9873F; --them-deep:#6B4922;
    --bad:#C2554A; --good:#7FA860;
    --display:"Zilla Slab",Georgia,serif;
    --body:"Archivo","Helvetica Neue",Arial,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
  h1,h2,h3,h4{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:var(--body);font:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--you);outline-offset:2px}

  /* ---------------- top bar ---------------- */
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brandmark{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.02em}
  .brandmark span{color:var(--them)}
  .topbar .spacer{flex:1}
  .btn{
    border:1px solid var(--edge);background:var(--raised);color:var(--ink);
    border-radius:9px;padding:10px 15px;font-size:14px;font-weight:500;transition:.15s;
  }
  .btn:hover{border-color:var(--edge-lit)}
  .btn.primary{background:var(--you);border-color:var(--you);color:#08201F;font-weight:700}
  .btn.primary:hover{filter:brightness(1.12)}
  .btn.ghost{background:transparent}
  .btn.small{padding:7px 12px;font-size:13px}
  .btn.danger:hover{border-color:var(--bad);color:var(--bad)}

  /* ---------------- the scene ---------------- */
  .scene{
    position:relative;border:1px solid var(--edge);border-radius:14px 14px 0 0;
    overflow:hidden;background:#0D0B0A;line-height:0;
  }
  .scene svg{width:100%;height:auto;display:block}
  .scene::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 38%,transparent 42%,rgba(8,7,6,.62) 100%);
  }
  .scene.shake{animation:shake .55s}
  .scene.pop{animation:pop .5s}
  @keyframes shake{10%,90%{transform:translateX(-4px)}30%,70%{transform:translateX(8px)}50%{transform:translateX(-9px)}}
  @keyframes pop{45%{transform:scale(1.012)}}

  /* ---------------- dialogue box ---------------- */
  .dialogue{
    border:1px solid var(--edge);border-top:0;background:
      linear-gradient(180deg,rgba(38,34,25,.95),rgba(28,25,22,.98));
    padding:14px 18px 16px;min-height:132px;position:relative;
  }
  .dl-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .dl-name{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.01em}
  .dl-role{font-size:12px;color:var(--ink-faint)}
  .dl-head .spacer{flex:1}
  .dl-round{
    font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-dim);
    border:1px solid var(--edge);border-radius:99px;padding:3px 10px;white-space:nowrap;
  }
  .dl-text{margin:0;font-size:17px;line-height:1.55;min-height:3.1em}
  .dl-text::after{content:"▌";color:var(--them);opacity:0;margin-left:2px}
  .dl-text.typing::after{opacity:1;animation:blink .8s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .dl-note{
    margin-top:10px;padding-top:9px;border-top:1px dashed var(--edge);
    font-size:13px;color:var(--ink-dim);
  }
  .dl-note b{color:var(--ink)}

  /* ---------------- action bar ---------------- */
  .actions{
    display:flex;gap:8px;flex-wrap:wrap;border:1px solid var(--edge);border-top:0;
    border-radius:0 0 14px 14px;background:var(--panel);padding:12px 14px;
  }
  .actions .spacer{flex:1}
  .say-row{display:flex;gap:8px;width:100%;margin-top:4px}
  .say-row input{
    flex:1;min-width:0;background:var(--raised);border:1px solid var(--edge);color:var(--ink);
    border-radius:9px;padding:10px 12px;font-size:14px;
  }
  .say-row input::placeholder{color:var(--ink-faint)}

  /* ---------------- term sheet drawer ---------------- */
  .backdrop{position:fixed;inset:0;background:rgba(8,7,6,.66);z-index:60;animation:fade .2s}
  .drawer{
    position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:70;
    width:min(100%,1040px);max-height:min(86vh,860px);overflow:auto;
    background:var(--panel);border:1px solid var(--edge);border-bottom:0;
    border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -18px 60px rgba(0,0,0,.6);animation:rise .28s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes rise{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .grip{width:44px;height:4px;border-radius:99px;background:var(--edge-lit);margin:0 auto 14px}
  .drawer-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}

  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;align-items:start}
  @media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
  .card{background:var(--raised);border:1px solid var(--edge);border-radius:11px;padding:13px 14px}

  .sheet{width:100%;border-collapse:collapse;font-size:14px}
  .sheet td{padding:5px 0;border-bottom:1px solid rgba(58,52,44,.55)}
  .sheet td:first-child{color:var(--ink-dim)}
  .sheet td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-faint);width:38px}
  .sheet tr:last-child td{border-bottom:0}

  .terms{display:flex;flex-direction:column;gap:12px}
  .term-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
  .term-name{font-family:var(--display);font-size:15px;font-weight:600}
  .stake{font-size:11px;color:var(--ink-faint);white-space:nowrap}
  .opts{display:flex;gap:6px;flex-wrap:wrap}
  .opt{
    flex:1 1 0;min-width:78px;background:#1F1C17;color:var(--ink-dim);
    border:1px solid var(--edge);border-radius:8px;padding:7px 6px;text-align:center;
    font-size:13px;transition:.14s;
  }
  .opt:hover{border-color:var(--you-deep);color:var(--ink)}
  .opt .pts{display:block;font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .opt[aria-pressed="true"]{background:var(--you-deep);border-color:var(--you);color:#fff}
  .opt[aria-pressed="true"] .pts{color:rgba(255,255,255,.82)}
  .opt.theirs{box-shadow:inset 0 -3px 0 var(--them)}

  .meter{margin-top:14px}
  .meter-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
  .meter-top b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
  .bar{position:relative;height:16px;background:#1F1C17;border:1px solid var(--edge);border-radius:6px;overflow:hidden}
  .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--you-deep),var(--you));transition:width .35s ease}
  .fill.under{background:linear-gradient(90deg,#4A231F,var(--bad))}
  .floor{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
  .meter-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);margin-top:5px}

  /* ---------------- brief + debrief ---------------- */
  .panel{background:var(--panel);border:1px solid var(--edge);border-radius:13px;padding:18px}
  .panel + .panel{margin-top:14px}
  .lede{font-size:17px;color:var(--ink-dim);max-width:62ch}
  .lede strong{color:var(--ink);font-weight:600}
  .split{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:16px}
  .rule{height:1px;background:var(--edge);margin:20px 0}
  .prio-row{display:grid;grid-template-columns:1fr 110px 34px;gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
  .prio-bar{height:9px;background:var(--raised);border-radius:99px;overflow:hidden}
  .prio-bar i{display:block;height:100%;background:var(--you);border-radius:99px}
  .prio-row span:last-child{text-align:right;color:var(--ink-faint);font-variant-numeric:tabular-nums}

  .verdict{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .grade{
    font-family:var(--display);font-size:54px;font-weight:700;line-height:1;
    width:94px;height:94px;display:grid;place-items:center;border-radius:14px;
    background:var(--raised);border:2px solid var(--edge);
  }
  .grade.hi{color:var(--good);border-color:var(--good)}
  .grade.mid{color:var(--them);border-color:var(--them)}
  .grade.lo{color:var(--bad);border-color:var(--bad)}
  .stats{display:flex;gap:20px;flex-wrap:wrap}
  .stat b{display:block;font-family:var(--display);font-size:25px;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}

  .scorecard{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  .scorecard th{
    text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-faint);font-weight:500;padding:0 8px 7px 0;border-bottom:1px solid var(--edge);
  }
  .scorecard td{padding:9px 8px 9px 0;border-bottom:1px solid rgba(58,52,44,.5)}
  .scorecard td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .won{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
  .won.you{background:rgba(78,168,160,.16);color:var(--you)}
  .won.them{background:rgba(201,135,63,.16);color:var(--them)}
  .won.split{background:var(--raised);color:var(--ink-faint)}

  .trade{border:1px solid var(--edge);border-radius:10px;padding:12px 14px;background:var(--raised)}
  .trade .line{display:flex;gap:9px;align-items:baseline;font-size:14px;margin-bottom:4px}
  .trade .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;width:36px;flex:none}
  .trade .tag.give{color:var(--them)} .trade .tag.take{color:var(--you)}
  .trade s{color:var(--ink-faint)}
  .trade .gain{font-size:12px;color:var(--good);margin-top:6px;font-variant-numeric:tabular-nums}

  .lesson{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid rgba(58,52,44,.5)}
  .lesson:last-child{border-bottom:0}
  .lesson .mark{font-family:var(--display);font-weight:700;font-size:16px;text-align:center}
  .lesson h4{margin:0 0 3px;font-size:15px}
  .lesson p{margin:0;color:var(--ink-dim);font-size:14px}
  .lesson.critical .mark,.lesson.critical h4{color:var(--bad)}
  .lesson.major .mark,.lesson.major h4{color:var(--them)}
  .lesson.minor .mark{color:var(--ink-dim)}
  .lesson.good .mark,.lesson.good h4{color:var(--good)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-dim);margin-top:8px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:5px;vertical-align:middle}

  .modal-back{position:fixed;inset:0;background:rgba(8,7,6,.74);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .18s}
  .modal{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:22px;max-width:min(94vw,440px);box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .modal h3{font-size:19px;margin-bottom:8px}
  .modal p{margin:0;color:var(--ink-dim);font-size:14px}
  .modal p b{color:var(--ink)}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="topbar">
    <div class="brandmark">The Deal<span>&nbsp;Room</span></div>
    <div class="spacer"></div>
    <button id="restart" class="btn ghost small" hidden>New deal</button>
  </div>
  <div id="app"></div>
</div>

<script>
"use strict";

/* ======================================================================
   1. Seeded randomness, so any deal can be replayed exactly.
   ====================================================================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rngFrom(seed){const r=mulberry32(seed);return{
  next:r,
  int:(lo,hi)=>lo+Math.floor(r()*(hi-lo+1)),
  pick:a=>a[Math.floor(r()*a.length)],
  chance:p=>r()<p,
  shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
}}

/* ======================================================================
   2. What is being bought and sold.
   ====================================================================== */
const CATALOG=[
  {item:"facial tissue",unit:"case",units:"cases",price:18.40,vols:[8000,20000,45000,90000],buyer:"a national drugstore chain",seller:"a paper converting mill"},
  {item:"lithium cells",unit:"cell",units:"cells",price:4.75,vols:[50000,150000,400000,900000],buyer:"an e-bike manufacturer",seller:"a battery fabricator"},
  {item:"cold brew concentrate",unit:"keg",units:"kegs",price:62.00,vols:[1200,3000,7500,16000],buyer:"a coffee shop group",seller:"a specialty roastery"},
  {item:"corrugated shipping boxes",unit:"bundle",units:"bundles",price:11.20,vols:[25000,60000,140000,300000],buyer:"an online retailer",seller:"a packaging plant"},
  {item:"stainless fasteners",unit:"box",units:"boxes",price:27.50,vols:[6000,15000,36000,80000],buyer:"an appliance assembler",seller:"a fastener works"},
  {item:"organic oat milk",unit:"case",units:"cases",price:21.80,vols:[10000,26000,60000,130000],buyer:"a grocery chain",seller:"a plant-milk dairy"},
  {item:"nitrile gloves",unit:"case",units:"cases",price:46.00,vols:[4000,11000,26000,55000],buyer:"a hospital network",seller:"a medical supplies maker"},
  {item:"recycled printer paper",unit:"pallet",units:"pallets",price:385.00,vols:[900,2200,5000,11000],buyer:"a government print office",seller:"a paper recycler"},
  {item:"disc brake rotors",unit:"unit",units:"units",price:8.90,vols:[20000,55000,130000,280000],buyer:"a bicycle brand",seller:"a components machinist"},
  {item:"solar microinverters",unit:"unit",units:"units",price:118.00,vols:[2000,5500,13000,28000],buyer:"a rooftop solar installer",seller:"a power electronics firm"},
  {item:"hardwood flooring planks",unit:"carton",units:"cartons",price:74.50,vols:[3500,9000,21000,46000],buyer:"a homebuilding group",seller:"a timber mill"},
  {item:"espresso machine gaskets",unit:"pack",units:"packs",price:33.00,vols:[3000,8000,19000,42000],buyer:"an appliance service network",seller:"a rubber moulder"}
];
const BUYER_CO=["Northwind","Cobalt Row","Harrow & Vale","Meridian","Fairweather","Bright Harbor","Kestrel","Ironwood","Tallgrass","Lumen","Redpoint"];
const SELLER_CO=["Castellan","Orsini","Pelham Works","Brightside","Aldergate","Voss & Sons","Quarry Lane","Marchetti","Stonefield","Halcyon"];
const SUFFIX=["Industries","Supply Co.","Group","Manufacturing","Partners","Works"];

/* ======================================================================
   3. The scenario. Both sides top out at 100. Price is a pure tug of war;
   the other four issues are weighted very differently for each side, and
   that asymmetry is the whole game.
   ====================================================================== */
const money=n=>n>=1000?"$"+n.toLocaleString(undefined,{maximumFractionDigits:0}):"$"+n.toFixed(2);
const commas=n=>n.toLocaleString();
function ladder(top,steps){const o=[];for(let i=0;i<steps;i++)o.push(Math.round(top*(steps-1-i)/(steps-1)));return o}
function splitWeight(total,parts,lo,hi,rng){
  const c=[];for(let i=0;i<parts;i++)c.push(rng.int(lo,hi));
  let drift=total-c.reduce((a,b)=>a+b,0),guard=0;
  while(drift!==0&&guard++<800){const i=rng.int(0,parts-1),s=drift>0?1:-1;
    if(c[i]+s>=lo&&c[i]+s<=hi){c[i]+=s;drift-=s}}
  return c;
}
function softIssue(key,label,labels,youTop,themTop){
  const y=ladder(youTop,labels.length), t=ladder(themTop,labels.length).slice().reverse();
  return{key,label,options:labels.map((l,i)=>({key:key+i,label:l,you:y[i],them:t[i]}))};
}
function buildScenario(seed){
  const rng=rngFrom(seed), product=rng.pick(CATALOG);
  const buyerCo=rng.pick(BUYER_CO)+" "+rng.pick(SUFFIX);
  const sellerCo=rng.pick(SELLER_CO)+" "+rng.pick(SUFFIX);
  const priceW=rng.pick([28,30,32]), buyerVol=rng.int(3,7), sellerVol=rng.int(30,38);
  const soft=rng.shuffle(splitWeight(100-priceW-buyerVol,3,14,32,rng));
  const theirSoft=rng.shuffle(splitWeight(100-priceW-sellerVol,3,3,17,rng));
  const mult=[0.86,0.93,1.00,1.08,1.16];
  const prices=mult.map(m=>product.price>=100?Math.round(product.price*m):Math.round(product.price*m*100)/100);
  const pb=ladder(priceW,5);
  const issues=[
    {key:"price",label:"Price per "+product.unit,options:prices.map((p,i)=>({key:String(p),label:money(p),raw:p,you:pb[i],them:priceW-pb[i]}))},
    {key:"volume",label:"Volume commitment",options:product.vols.map((v,i)=>({key:String(v),label:commas(v)+" "+product.units,raw:v,
      you:ladder(buyerVol,4)[i],them:ladder(sellerVol,4).slice().reverse()[i]}))},
    softIssue("payment","Payment terms",["Net 90","Net 60","Net 30","Net 15"],soft[0],theirSoft[0]),
    softIssue("delivery","Delivery window",["2 weeks","4 weeks","8 weeks","12 weeks"],soft[1],theirSoft[1]),
    softIssue("exclusivity","Exclusivity",["Global, 2 yrs","Region, 2 yrs","Region, 1 yr","None"],soft[2],theirSoft[2])
  ];
  const sc={product,buyerCo,sellerCo,issues,seed,
    buyerRole:"Head of Procurement, "+buyerCo, sellerRole:"VP of Sales, "+sellerCo};
  setWalkaways(sc,rng);
  return sc;
}
function allPackages(sc){
  if(sc._all)return sc._all;
  const out=[];
  const walk=(i,picks,you,them)=>{
    if(i===sc.issues.length){out.push({picks:picks.slice(),you,them});return}
    for(const o of sc.issues[i].options){picks.push(o.key);walk(i+1,picks,you+o.you,them+o.them);picks.pop()}
  };
  walk(0,[],0,0);sc._all=out;return out;
}
const optionOf=(iss,k)=>iss.options.find(o=>o.key===k);
const scoreOf=(sc,picks)=>{let you=0,them=0;sc.issues.forEach((iss,i)=>{const o=optionOf(iss,picks[i]);you+=o.you;them+=o.them});return{you,them}};
const stakeYou=i=>Math.max(...i.options.map(o=>o.you))-Math.min(...i.options.map(o=>o.you));
const stakeThem=i=>Math.max(...i.options.map(o=>o.them))-Math.min(...i.options.map(o=>o.them));
function setWalkaways(sc,rng){
  const all=allPackages(sc), tilt=rng.int(-3,3);let chosen=[40,40];
  for(let base=60;base>=25;base--){
    const b=base+tilt,s=base-tilt;
    const frac=all.filter(p=>p.you>=b&&p.them>=s).length/all.length;
    if(frac>=0.10&&frac<=0.30){chosen=[b,s];break}
    if(frac>0.30){chosen=[b,s];break}
  }
  sc.buyerWalk=chosen[0];sc.sellerWalk=chosen[1];
}
const viablePackages=sc=>allPackages(sc).filter(p=>p.you>=sc.buyerWalk&&p.them>=sc.sellerWalk);
const maxJoint=sc=>Math.max(...allPackages(sc).map(p=>p.you+p.them));
function frontier(sc){
  if(sc._front)return sc._front;
  const all=allPackages(sc).slice().sort((a,b)=>b.you-a.you||b.them-a.them);
  const out=[];let best=-1;
  for(const p of all)if(p.them>best){out.push(p);best=p.them}
  sc._front=out;return out;
}
const contractValue=(sc,p)=>optionOf(sc.issues[0],p[0]).raw*optionOf(sc.issues[1],p[1]).raw;

/* ======================================================================
   4. Personalities -- how they behave, how they talk, how they dress,
   and the room they do it in.

   Dress and office ARE tells here: they are things a person chooses, and
   a real negotiator reads them. Skin tone, name and face are drawn
   separately and mean nothing, because they are not tells -- they are
   just people.
   ====================================================================== */
const PERSONAS=[
{key:"shark",name:"The Shark",blurb:"Closes for a living and enjoys it. Takes everything you leave loose.",
 tell:"Never volunteers information. Every silence is bait.",
 look:"Immaculate. Three-piece, cufflinks, not a hair out of place.",
 room:"corner",style:"predator",
 open:95,rate:0.7,margin:10,patience:3,delight:84,honesty:0.25,rest:"smug",
 lines:{
  open:["Let's skip the part where you pretend to be shocked. Here's the paper.","I've got three of these today. You're the one I have the least time for.","I'll save us both an hour. This is the number. Convince me otherwise."],
  insult:["Be serious. I've seen interns open better than that, and they were being funny.","That's not an offer, that's a cry for help.","You said that out loud. On purpose. Wild."],
  below:["Under my floor. Not close, not cute, not happening.","No. And the fact you thought that might land tells me plenty.","You're negotiating against yourself and still losing."],
  close:["Now you're talking like someone who's done this before. Almost.","That's within shouting distance. You've still got more in the tank.","Warmer. I can smell a deal. I don't like the smell yet."],
  accept:["Done. For the record, you left money on this table. I'm not telling you where.","Signed. You did fine. Fine is what people say when they mean not great.","I'll take it. Don't ask me who won."],
  thin:["It's thin and you know it's thin. My quarter closes Friday, so: fine.","I'm signing this out of spite for my own forecast. Congratulations."],
  delight:["Sold. SOLD. Before you find a calculator.","Absolutely. Signed. Do you want a pen? I have a pen. Here's a pen.","That's the best thing anyone's said to me this quarter. Done."],
  rage:["No. We're done. Nineteen years and I don't get spoken to like that.","Get out. Genuinely. Take your term sheet and go."],
  walk:["Clock's dead and so is this. I'd rather run short than sign that.","No deal. I'll find someone who can count."],
  pressed:["Because I said so, and because I have the capacity you need.","My reasoning is I don't need this deal as much as you do."],
  threat:["Walk then. The door works. I've watched people use it.","Sure. Monday you explain to your board why you have no supplier."],
  small:["We're not friends. We can be friendly. Different things.","Small talk is how people stall when they're losing. Are you losing?"],
  goodbye:["You did well and I won't pretend otherwise. You worked out what I was protecting and made me pay for it."],
  badbye:["Free lesson, since it costs me nothing now: you fought hardest on the one term where neither of us could win. I let you."]}},

{key:"pro",name:"The Professional",blurb:"Courteous, prepared, genuinely trying to find a deal that works.",
 tell:"Actually answers questions. Rewards you for asking good ones.",
 look:"Well-cut but unshowy. Blazer, open collar, no theatre.",
 room:"corporate",style:"tailored",
 open:90,rate:1.1,margin:18,patience:5,delight:88,honesty:0.85,rest:"neutral",
 lines:{
  open:["Thanks for the time. I'll open where I'd like to land and we work back from there.","Good to meet you. I've done my homework, so I'll be direct.","Here's my opening. I don't expect you to take it."],
  insult:["I'll take that as an anchor rather than a proposal. Let's move past it.","That's below anything I could defend internally. By some way.","I understand the tactic. It costs us a round we don't have many of."],
  below:["That doesn't clear my approval threshold. I'm not being coy.","Right shape, wrong level.","I can't sign that. Tell me which term you actually need and I'll build around it."],
  close:["Workable in principle. Let me push on one thing and I think we're there.","Close enough that I'd like to land it today rather than trade paper again.","I could live with that shape. Give me a little on one term and I'll stop asking."],
  accept:["That works. Good negotiation, genuinely. I'll get it to legal today.","Agreed. You handled that well and I don't say it to be nice.","Done. I'd do business with you again, which is the real compliment."],
  thin:["Tighter than I'd like, but a deal beats a gap. Agreed.","I'll take it. We both know who did better, but I'd rather ship."],
  delight:["I... yes. Absolutely yes. For the record, you didn't have to do that.","Signed. Free advice for next time: you had far more room than you used."],
  rage:["No. I've been patient and you've spent it. I'm ending this.","I'll stop before I say something unprofessional. We're finished."],
  walk:["Out of time and out of overlap. No hard feelings, but no deal.","I can't get there. Let's part cleanly rather than force something bad."],
  pressed:["Fair question. My capacity is committed eight months out. That's what drives me.","The economics only work above a line, and I'd rather show you the line than hide it."],
  threat:["That's your call. I'd rather you didn't, and I'll move if I can.","Understood. Before you do, tell me the one term that would change your mind."],
  small:["Ha. Good. Right, where were we.","I appreciate a bit of human in the room. Now, terms."],
  goodbye:["Genuinely well played. You asked the right question early and built around the answer. Most people never do either."],
  badbye:["Can I offer something? You conceded on the terms you needed and held firm on the ones you didn't. That's backwards, and it's common."]}},

{key:"burnout",name:"The Burnout",blurb:"Checked out three quarters ago. Concedes fast, or stops caring entirely.",
 tell:"Gives ground quickly if you ask plainly. Tunes out during long speeches.",
 look:"Hoodie over a shirt he slept in. Lanyard on backwards.",
 room:"grind",style:"rumpled",
 open:86,rate:1.5,margin:25,patience:6,delight:80,honesty:0.7,rest:"bored",
 lines:{
  open:["Sure. Yeah. Here's the thing my boss told me to say. I don't love it either.","Right. Opening offer. I typed it this morning. Allegedly.","Cool cool cool. Numbers. Here. Whenever."],
  insult:["Damn. Okay. That's a choice.","Yeah, no. I'm tired, not concussed.","That's crazy work. Anyway."],
  below:["Nah, that doesn't clear. Not by a lot. Not by a little either.","Can't. My floor's a floor. It's the one thing I still enforce.","Under. Try again but like, actually try."],
  close:["Yeah that's basically fine. I'd take more but I'm not gonna fight you.","Eh. Close enough that I've stopped reading carefully.","Okay yeah, nearly there, and I have a 4pm."],
  accept:["Yeah alright. Send it. I'm not re-reading that.","Sure. Done. I'm going to go stare at a wall.","Fine, signed, great, wonderful, I'm logging off."],
  thin:["Whatever. Yes. It's Friday somewhere.","Sure. Not my money. Signed."],
  delight:["Wait. Say that again. ...Okay yeah I'm awake now. Signed.","Bro. BRO. Yes. I'm putting this in the group chat."],
  rage:["Okay, no. I don't get paid enough to be spoken to like that. I'm out.","You know what? No. Done. Genuinely done. Bye."],

  pressed:["Honestly? I don't know. It's the number in the spreadsheet.","Someone above me has a target and I'd like them to stop emailing me."],
  threat:["Okay. I mean, that'd be less work for me.","You could. Then we both go home. Not your worst pitch."],
  small:["Yeah. Same. It's been a long year and it's March.","You ever think about how we're both doing this until we die? Anyway, terms."],
  goodbye:["Yeah alright, that was decent. You didn't waffle. I respect not waffling."],
  badbye:["Not being funny but I'd have caved on like three of those if you'd pushed. I was barely here."]}},

{key:"hype",name:"The Hype Guy",blurb:"Enormously friendly. Also the slipperiest person in the room.",
 tell:"The warmth is real and so is the squeeze. Don't mistake one for the other.",
 look:"Quarter-zip, fresh fade, a chain he wants you to notice.",
 room:"startup",style:"flashy",
 open:93,rate:0.95,margin:14,patience:4,delight:85,honesty:0.4,rest:"pleased",
 lines:{
  open:["Okay okay okay, love this for us. Two serious people, one table. Here's my opener, don't cry.","First of all? Great energy. Second of all, here's a number that's gonna test it.","We are SO getting this done. Starting here. Purely as a vibe check."],
  insult:["Bro. BRO. That's diabolical. I'm not mad, I'm impressed by the audacity.","That offer is doing negative aura farming. Respectfully, delete it.","Chat, is this real? You typed that with your hands?"],
  below:["Love the ambition, hate the number. Under my floor, king.","So close to cooking and yet the kitchen is on fire.","That's mid and I say it with affection. Under my line."],
  close:["OH. Now we're talking. That's got legs. Nearly got arms.","Okay that's a real offer and I'm going to be annoying about the last bit.","We are THIS close. One more thing and I stop yapping."],
  accept:["YES. Let's go. Deal. Shaking your hand so hard right now.","Done deal! W for both of us. Mostly me, but a W is a W.","Signed, sealed, and I'm telling everyone we're best friends."],
  thin:["Ugh. Fine. FINE. You wore me down and I'll think about it tonight.","Taking it. Not happy. Still taking it. That's growth."],
  delight:["Oh my God. Oh my GOD. Signed. Don't move, don't think, sign here.","Most generous thing anyone's done for me since my mum. SOLD."],
  rage:["Nope. I was nice to you. I was SO nice to you. We're done.","Okay the vibe is dead and you killed it. I'm walking."],
  walk:["Ahh man. No deal. That one hurts, genuinely.","We ran out of clock. So unserious of us both."],
  pressed:["Why? Because I like winning and I'm very charming about it.","Great question. Terrible answer: the number is the number, my guy."],
  threat:["Don't say that. Don't SAY that. We were having a moment.","You'd walk? On me? After everything we've been through in eleven minutes?"],
  small:["See THIS is what I'm talking about. Human connection. Now give me volume.","I love that for you. Genuinely. Anyway I still want your money."],
  goodbye:["Okay real talk, that was clean. You clocked what I actually wanted and charged me for it. Respect."],
  badbye:["Love you, but you got played by a guy being nice to you. That's the whole trick. That's the entire trick."]}},

{key:"bureaucrat",name:"The Bureaucrat",blurb:"Hides behind process. Every concession needs a permission slip.",
 tell:"'I can't approve that' often means 'I can, and I'd rather not.'",
 look:"Grey suit off the rack, ID badge, pen in the top pocket.",
 room:"institutional",style:"issued",
 open:91,rate:0.85,margin:16,patience:6,delight:86,honesty:0.5,rest:"neutral",
 lines:{
  open:["I've brought the standard terms. Deviations need sign-off, which is slow.","This is our approved opening position. I didn't write it. I do have to defend it.","Anything outside this framework goes to committee. Plan accordingly."],
  insult:["I can't record that as a serious proposal. Shall we try again?","That falls outside every band I'm permitted to work in.","I'd have to escalate that, and I won't, because I'd be laughed at."],
  below:["Below my delegated authority. I physically cannot sign it.","Non-compliant with our floor. I'm not being difficult, I'm supervised.","If you want that you want my director, and she likes you less than I do."],
  close:["Within a band I could defend. Let me push once, then I'll stop.","I think I can get that through. One more concession makes the memo easier.","Nearly signable. Give me something to point at in the write-up."],
  accept:["Within my authority. Approved. I'll circulate the paperwork.","Agreed. This will be a clean memo, which is the highest praise I give.","Signed. You made my internal justification very easy."],
  thin:["At the very edge of what I can defend. I'll take the risk. Once.","Approved, reluctantly. I'll be writing 'commercially necessary' a lot."],
  delight:["Approved. Immediately. I will hand-carry this to legal personally.","Comfortably inside every band I have. Signed. No further questions."],
  rage:["I'm terminating this session. That was unacceptable and it will be minuted.","No. I'm ending the meeting. Take it up with my director."],
  walk:["The window has closed. Recording this as no agreement reached.","We've exhausted the process. No deal. I'll file it."],
  pressed:["Policy. I know that's unsatisfying. It's also true.","The approval matrix says so, and the matrix does not take meetings."],
  threat:["Noted. It doesn't change my authority, but it is noted.","If you walk I file a no-deal report. I'd rather not."],
  small:["Mm. Yes. Shall we return to the terms?","I'd love to chat, but I have a governance call at half past."],
  goodbye:["Efficiently done. You found the terms I had discretion on and stayed there. Few people bother."],
  badbye:["A note for next time: I said 'I can't approve that' about six times. On four of those I could have. You never tested it once."]}},

{key:"volatile",name:"The Live Wire",blurb:"Charming at nine, hostile at nine-thirty. Test carefully or not at all.",
 tell:"Real leverage, no filter. Lowball once and you may not get a second round.",

{key:"quant",name:"The Quant",blurb:"Treats this as arithmetic. No warmth, no games, no mercy either.",
 tell:"Completely consistent. Find the logic and you can predict every move.",
 look:"Plain shirt, plain glasses, no accessories of any kind.",

 open:92,rate:1.0,margin:15,patience:8,delight:86,honesty:0.9,rest:"neutral",
 lines:{

  below:["Below my reservation value. I'd take no deal over that, by definition.","Doesn't clear. The deficit is meaningful, not marginal.","No. Tell me which term you weight highest and I'll optimise around it."],

  delight:["Accepted immediately. To be clear, you did not have to offer that.","That's a substantial overpayment. I'm taking it. Model your side next time."],

const luminance=h=>{const n=parseInt(h.slice(1),16);return 0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255)};
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=Math.max(0,Math.min(255,(n>>16)+amt)), g=Math.max(0,Math.min(255,((n>>8)&255)+amt)), b=Math.max(0,Math.min(255,(n&255)+amt));
  return"#"+((r<<16)|(g<<8)|b).toString(16).padStart(6,"0");
}
function makeCharacter(rng,company){
  const persona=rng.pick(PERSONAS), w=WARDROBE[persona.style];
  const skin=rng.pick(SKIN);
  let hair=rng.pick(HAIRC);
  if(Math.abs(luminance(hair)-luminance(skin))<52){         // hair must not vanish into the face
    const clear=HAIRC.filter(h=>Math.abs(luminance(h)-luminance(skin))>=62);
    hair=clear.length?rng.pick(clear):(luminance(skin)>120?"#15110F":"#DCC894");
  }
  if(persona.style==="heritage"&&rng.chance(0.6))hair=rng.pick(["#8E8B85","#CFCBC4","#B8B4AC"]);
  return{
    name:rng.pick(FIRST)+" "+rng.pick(LAST),
    title:"VP of Sales",company,persona,
    look:{skin,hair,cut:rng.pick(w.cuts),coat:rng.pick(w.coats),shirt:rng.pick(w.shirts),
      hairstyle:rng.pick(w.hairs),facial:rng.pick(w.facial),eyewear:rng.pick(w.eyewear),
      prop:rng.pick(w.props),
      jaw:rng.pick(["round","square","narrow"])}
  };
}

function hairSVG(l){

  switch(l.hairstyle){

      front.push(cap(54,34));

    case"slick":
      front.push(cap(58,37));

    case"parted":
      front.push(cap(58,37));
      front.push(`<path d="M 126 26 L 120 82" stroke="${shade(c,-40)}" stroke-width="3.5" clip-path="url(#hc)"/>`);break;
    case"receding":
      front.push(`<ellipse cx="76" cy="62" rx="22" ry="26" fill="${c}" clip-path="url(#hc)"/>`,
                 `<ellipse cx="144" cy="62" rx="22" ry="26" fill="${c}" clip-path="url(#hc)"/>`);break;
    case"grey":
      front.push(cap(58,37));
      front.push(`<ellipse cx="110" cy="52" rx="44" ry="20" fill="${shade(c,30)}" opacity=".5" clip-path="url(#hc)"/>`);break;
    case"curls":
      front.push(cap(60,38));
      for(let i=0;i<8;i++)front.push(`<circle cx="${64+i*13}" cy="${i%2?52:58}" r="12" fill="${i%2?hi:c}"/>`);break;
    case"waves":

  return{back:back.join(""),front:front.join("")};
}

function skylineSVG(rng,x,y,w,h,night){
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${night?"#11151F":"#7E9AB3"}"/>`;
  if(!night)s+=`<rect x="${x}" y="${y}" width="${w}" height="${h*0.55}" fill="#9CB4C9"/>`;
  let cx=x;
  while(cx<x+w){
    const bw=rng.int(22,46), bh=rng.int(Math.round(h*0.3),Math.round(h*0.88));
    const by=y+h-bh;
    s+=`<rect x="${cx}" y="${by}" width="${bw}" height="${bh}" fill="${night?"#1B2130":"#5A7186"}"/>`;
    for(let wy=by+6;wy<y+h-6;wy+=11)
      for(let wx=cx+4;wx<cx+bw-5;wx+=9)
        if(rng.chance(night?0.42:0.18))
          s+=`<rect x="${wx}" y="${wy}" width="4" height="5" fill="${night?"#E8C88A":"#3E5265"}" opacity="${night?0.9:0.5}"/>`;
    cx+=bw+rng.int(3,10);
  }
  return s;
}
function windowSVG(kind,rng,night){

  let inner="";
  if(kind==="skyline")inner=skylineSVG(rng,x,y,w,h,night);
  else if(kind==="glass"){
    inner=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${night?"#1A2029":"#8FA6B8"}"/>`+
      skylineSVG(rng,x,y+h*0.35,w,h*0.65,night);

    inner=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${night?"#14171C":"#6E7F8E"}"/>`;
    for(let i=0;i<5;i++)inner+=`<rect x="${x+20+i*62}" y="${y+40}" width="42" height="120" fill="${night?"#0F1216":"#5A6B79"}"/>`;
  } else if(kind==="industrial"){
    inner=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${night?"#171B20":"#7C8A96"}"/>`;

  } else if(kind==="sash"){
    inner=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${night?"#161A1F":"#88A08D"}"/>`;

    inner+=`<rect x="${x}" y="${y+h/2-3}" width="${w}" height="6" fill="#241C15"/>`;
  } else if(kind==="blinds"){
    inner=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${night?"#1A1D18":"#94A08A"}"/>`;

/* ======================================================================
   7. The seller's decision making. The rules decide everything that
   matters; dialogue only supplies the words.
   ====================================================================== */
function makeSeller(sc,persona,rounds,rng){
  const all=allPackages(sc), importance={};
  sc.issues.forEach(i=>importance[i.key]=1);
  return{
    persona,rounds,rng,insults:0,lastPlayer:null,lastCounter:null,importance,
    target(round){
      const floor=sc.sellerWalk+3;
      if(rounds<=1)return floor;
      const p=Math.min(1,(round-1)/(rounds-1)*persona.rate);
      return Math.round(persona.open-(persona.open-floor)*p);
    },
    guess(picks){
      let t=0;
      sc.issues.forEach((iss,i)=>{
        const idx=iss.options.findIndex(o=>o.key===picks[i]);
        t+=importance[iss.key]*((iss.options.length-1-idx)/(iss.options.length-1));
      });
      return t;
    },
    observe(picks){
      sc.issues.forEach((iss,i)=>{
        const idx=iss.options.findIndex(o=>o.key===picks[i]);
        if(!this.lastPlayer){if(idx===0)importance[iss.key]+=0.4;return}
        const was=iss.options.findIndex(o=>o.key===this.lastPlayer[i]);
        if(idx>was)importance[iss.key]=Math.max(0.4,importance[iss.key]-0.6);
        else if(idx===was&&idx<=1)importance[iss.key]+=0.8;
      });
      this.lastPlayer=picks.slice();
    },
    nudge(k,d){importance[k]=Math.max(0.3,importance[k]+d)},
    pick(min,ceiling){
      let pool=all.filter(p=>p.them>=min);
      if(ceiling!=null){const t=pool.filter(p=>p.them<=ceiling);if(t.length)pool=t}
      if(!pool.length)pool=[all.reduce((a,b)=>b.them>a.them?b:a)];
      let best=pool[0],bg=-1;
      for(const p of pool){const g=this.guess(p.picks);if(g>bg||(g===bg&&p.them<best.them)){best=p;bg=g}}
      return best;
    },
    advance(target){
      const ceiling=this.lastCounter?this.lastCounter.them:null;
      let c=this.pick(target,ceiling);
      if(this.lastCounter&&this.guess(c.picks)<this.guess(this.lastCounter.picks))c=this.lastCounter;
      this.lastCounter=c;return c;
    },
    opening(){this.lastCounter=this.pick(persona.open,persona.open+6);return this.lastCounter},
    insultLevel(them){
      const gap=sc.sellerWalk-them;
      if(gap<persona.margin)return 0;
      return gap>=persona.margin*2?2:1;
    },
    respond(picks,round){
      this.observe(picks);
      const mine=scoreOf(sc,picks).them, target=this.target(round), final=round>=rounds;
      if(mine>=persona.delight)return{kind:"accept",mood:"delight"};
      const sev=this.insultLevel(mine);
      if(sev){
        this.insults+=sev;
        if(this.insults>persona.patience)return{kind:"rage",mood:"rage"};
        if(!final)return{kind:"counter",offer:this.advance(target),mood:"insult"};
      }
      if(mine>=target)return{kind:"accept",mood:"accept"};
      if(final)return mine>=sc.sellerWalk?{kind:"accept",mood:"thin"}:{kind:"nodeal",mood:"walk"};
      return{kind:"counter",offer:this.advance(target),mood:mine<sc.sellerWalk?"below":"close"};
    },
    hint(){
      const r=sc.issues.slice().sort((a,b)=>stakeThem(b)-stakeThem(a));
      if(rng.chance(persona.honesty))
        return `${r[0].label} decides whether this is worth doing for me, with ${r[1].label.toLowerCase()} behind it. ${r[r.length-1].label} I have more room on than you'd think.`;
      return `${r[1].label} is what I'm measured on this quarter, so that's where I'm least flexible. Everything else I can look at.`;
    }
  };
}

   ====================================================================== */
const INTENTS=[
  ["priorities",[/\bwhat (do you|matters|are you|would you)\b/,/\bmost important\b/,/\bpriorit/,/\bcare (most )?about\b/,/\bwhat.*\bneed\b/,/\bwhich.*\bmatter/,/\bdriving\b/]],
  ["why",[/\bwhy\b/,/\bjustify\b/,/\bexplain\b/,/\bhow come\b/,/\bon what basis\b/]],
  ["threat",[/\bwalk (away|out)\b/,/\bleave the table\b/,/\bno deal\b/,/\banother supplier\b/,/\bcompetitor\b/,/\bgo elsewhere\b/,/\bfind someone else\b/]],
  ["insult",[/\bridiculous\b/,/\bjoke\b/,/\binsult/,/\bpathetic\b/,/\bwaste of\b/,/\bclown\b/,/\bnonsense\b/,/\brobbery\b/,/\bripping me off\b/,/\bgreedy\b/]],
  ["trade",[/\bif you\b.*\bi(')?ll\b/,/\bin (exchange|return)\b/,/\btrade\b/,/\bgive you\b/,/\bswap\b/,/\bi can (give|offer|do)\b/,/\bwould you take\b/,/\bhow about\b/]],
  ["flexible",[/\bflexible\b/,/\bdon'?t (really )?care about\b/,/\bnot (that )?important to (me|us)\b/,/\bhappy to move\b/,/\bcan live with\b/,/\bopen to\b/]],
  ["deadline",[/\bhurry\b/,/\bquick/,/\bclose (this|it) (out|today)\b/,/\bwrap (this )?up\b/,/\brunning out\b/]],
  ["flatter",[/\brespect\b/,/\bappreciate\b/,/\bfair enough\b/,/\bpleasure\b/,/\bthank you\b/,/\bthanks\b/,/\bimpress/,/\bgood point\b/]],
  ["small",[/\bhow are you\b/,/\bweekend\b/,/\bweather\b/,/\bcoffee\b/,/\bhello\b/,/\bhi\b/,/\bhey\b/,/\blunch\b/,/\bfamily\b/]]
];
const PRIORITY={threat:5,insult:5,trade:4,priorities:4,flexible:3,why:3,deadline:2,flatter:1,small:0};
function classify(text){
  const t=text.toLowerCase().trim();if(!t)return"none";
  let best="none",bs=0;
  for(const[name,pats]of INTENTS){
    const hits=pats.filter(p=>p.test(t)).length;
    if(hits&&(hits>bs||(hits===bs&&PRIORITY[name]>(PRIORITY[best]||-1)))){best=name;bs=hits}
  }
  return best;
}
const ISSUE_WORDS={price:["price","unit cost","per unit","cost","cheaper","expensive"],
  volume:["volume","units","quantity","commit","order size","annual"],
  payment:["payment","net ","terms","pay ","invoice","cash"],
  delivery:["delivery","lead time","weeks","fast","ship","schedule"],
  exclusivity:["exclusiv","compet","rights","lock"]};
const namedIssues=(text,sc)=>{const t=text.toLowerCase();
  return sc.issues.filter(i=>(ISSUE_WORDS[i.key]||[]).some(w=>t.includes(w))).map(i=>i.key)};

        <span class="dl-role">${esc(G.ch.title)}, ${esc(G.ch.company)}</span>

        <span class="dl-round" id="round">Round 1 / ${G.rounds}</span>

    </div>
    <div class="actions">
      <button class="btn primary" id="counter">Open the term sheet</button>

      <button class="btn ghost" id="ask">Ask what matters</button>
      <span class="spacer"></span>

      <div class="say-row">
        <input id="sayinput" placeholder="Say something to them&hellip;" autocomplete="off">
        <button class="btn" id="saybtn">Say it</button>

  document.getElementById("counter").onclick=openDrawer;
  document.getElementById("accept").onclick=acceptTheirs;

/* Dialogue types itself out, like a game. Click to skip. */
function speak(text,mood,note){
  G.said=text;G.note=note||"";
  if(mood)G.mood=mood;
  const scene=document.getElementById("scene");
  if(scene)scene.innerHTML=sceneSVG(G.ch,G.mood,G.seed);
  const dl=document.getElementById("dl"), n=document.getElementById("note");
  const r=document.getElementById("round");
  if(r)r.textContent=`Round ${Math.min(G.round,G.rounds)} / ${G.rounds}`;
  if(n){n.innerHTML=G.note;n.hidden=!G.note}
  if(!dl)return;
  if(typing){clearInterval(typing);typing=null}
  if(reduced()){dl.textContent='"'+text+'"';dl.classList.remove("typing");return}
  const full='"'+text+'"';let i=0;
  dl.textContent="";dl.classList.add("typing");
  typing=setInterval(()=>{
    i+=2;dl.textContent=full.slice(0,i);
    if(i>=full.length){clearInterval(typing);typing=null;dl.classList.remove("typing")}
  },16);
}
function finishTyping(){
  if(!typing)return;
  clearInterval(typing);typing=null;
  const dl=document.getElementById("dl");
  dl.textContent='"'+G.said+'"';dl.classList.remove("typing");
}
function react(mood,fx){
  G.mood=mood;
  const scene=document.getElementById("scene");
  if(!scene)return;
  scene.innerHTML=sceneSVG(G.ch,mood,G.seed);
  if(fx&&!reduced()){scene.classList.remove("shake","pop");void scene.offsetWidth;scene.classList.add(fx)}
}

/* --------------------------------------------------------- dialogs */
function ask(title,body,okLabel){
  return new Promise(resolve=>{
    const back=document.createElement("div");back.className="modal-back";
    back.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h3>${esc(title)}</h3><p>${body}</p>
      <div class="modal-actions"><button class="btn" data-no>Go back</button>
        <button class="btn primary" data-yes>${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(back);
    const done=v=>{back.remove();document.removeEventListener("keydown",onKey);resolve(v)};
    const onKey=e=>{if(e.key==="Escape")done(false)};
    document.addEventListener("keydown",onKey);
    back.querySelector("[data-yes]").onclick=()=>done(true);
    back.querySelector("[data-no]").onclick=()=>done(false);
    back.addEventListener("click",e=>{if(e.target===back)done(false)});
    back.querySelector("[data-no]").focus();
  });
}

/* --------------------------------------------------------- actions */
async function sendOffer(){
  const {sc}=G, picks=G.draft.slice(), y=scoreOf(sc,picks);
  if(y.you<sc.buyerWalk){
    const ok=await ask("That offer is below your own floor",
      `This package is worth <b>${y.you}</b> to you. Your walk-away is <b>${sc.buyerWalk}</b>.
       If they sign it, you have done worse than not signing at all.`,"Send it anyway");
    if(!ok)return;
  }
  closeDrawer();
  G.yours=picks;G.log.offers.push(picks);
  const reply=G.seller.respond(picks,G.round), p=G.ch.persona;

  if(reply.kind==="accept"){
    const fleeced=reply.mood==="delight";
    react(fleeced?"delighted":reply.mood==="thin"?"smug":"pleased","pop");
    speak(pickLine(p,fleeced?"delight":reply.mood==="thin"?"thin":"accept",G.rng),null,
      fleeced?"They could not sign it fast enough. That is never a good sign.":"");
    return setTimeout(()=>finish("signed",picks,fleeced),2100);
  }
  if(reply.kind==="rage"){
    react("furious","shake");
    speak(pickLine(p,"rage",G.rng),null,
      "They shove the chair back, sweep the term sheet off the desk and walk out.");
    return setTimeout(()=>finish("raged",null,false),2600);
  }
  if(reply.kind==="nodeal"){
    react("angry","shake");
    speak(pickLine(p,"walk",G.rng),null,"");
    return setTimeout(()=>finish("theywalked",null,false),2200);
  }
  const moved=movedTerm(G.theirs,reply.offer.picks);
  G.theirs=reply.offer.picks.slice();G.round++;
  const mood=reply.mood==="insult"?"angry":reply.mood==="close"?"thinking":"annoyed";
  react(mood,null);
  speak(pickLine(p,reply.mood,G.rng),null,
    moved?`They moved on <b>${esc(moved)}</b>. Their offer is now worth <b>${scoreOf(sc,G.theirs).you}</b> to you.`
         :`Their offer is worth <b>${scoreOf(sc,G.theirs).you}</b> to you.`);
  if(G.round>G.rounds)setTimeout(()=>finish("timeout",null,false),2200);
}
function movedTerm(a,b){for(let i=0;i<a.length;i++)if(a[i]!==b[i])return G.sc.issues[i].label;return null}

async function acceptTheirs(){
  const {sc}=G, y=scoreOf(sc,G.theirs);
  if(y.you<sc.buyerWalk){
    const ok=await ask("That is worse than walking out",
      `Their package is worth <b>${y.you}</b> to you. Walking away is worth <b>${sc.buyerWalk}</b>.
       Signing this is the one move that is strictly worse than no deal.`,"Sign it anyway");
    if(!ok)return;
  }
  closeDrawer();
  finish("signed",G.theirs.slice(),false);
}
function askPriorities(){
  G.log.asked=true;
  react("thinking",null);
  speak(G.seller.hint(),null,"Asking cost you nothing and no round. Most people never do it once.");
}
async function walkAway(){
  const y=scoreOf(G.sc,G.theirs).you;
  const ok=await ask("Leave the table?",
    `Walking away scores you <b>${G.sc.buyerWalk}</b>. Their current offer is worth <b>${y}</b>.
     ${G.sc.buyerWalk>y?"Walking is the better of the two right now.":"Their offer already beats walking away."}`,"Walk away");
  if(ok)finish("youwalked",null,false);
}
function saySomething(){
  const input=document.getElementById("sayinput"), text=input.value.trim();
  if(!text)return;
  input.value="";
  const p=G.ch.persona, kind=classify(text), named=namedIssues(text,G.sc);
  const labels=named.map(k=>G.sc.issues.find(i=>i.key===k).label.toLowerCase()).join(", ");
  if(kind==="priorities")return askPriorities();
  let key="small",mood=p.rest,note="";
  switch(kind){
    case"why":key="pressed";mood="smug";break;
    case"threat":key="threat";mood="smug";note="Threats are cheap. They only work if they think you mean it.";break;
    case"insult":key="insult";mood="angry";G.seller.insults++;G.log.insults++;
      note="That cost you goodwill. Some people have very little to spare.";break;
    case"flatter":key="small";mood="pleased";G.seller.insults=Math.max(0,G.seller.insults-1);G.log.warmth++;
      note="Warmth is free and it buys you patience.";break;
    case"flexible":key="small";mood="smug";
      named.forEach(k=>{G.seller.nudge(k,-1.2);if(!G.log.revealed.includes(k))G.log.revealed.push(k)});
      note=named.length?`You just told them you don't care about ${esc(labels)}. They will stop paying you for it.`
                       :"You signalled flexibility without saying where. That is the safer version.";break;
    case"trade":key="close";mood="thinking";named.forEach(k=>G.seller.nudge(k,0.8));
      note=named.length?`You flagged ${esc(labels)} as something you want. Now put it in an actual offer.`
                       :"Naming a trade out loud is good. Now table it as an offer.";break;
    case"deadline":key="small";mood="bored";break;
  }
  react(mood,null);
  speak(pickLine(p,key,G.rng),null,note);
}

/* ======================================================================
   10. The debrief.
   ====================================================================== */
function finish(kind,picks,fleeced){
  if(typing){clearInterval(typing);typing=null}
  closeDrawer();
  G.outcome={kind,picks,fleeced};
  showDebrief();
}
/* No SINGLE term can help both sides -- each issue is a straight tug of
   war. Gains for both exist only in two-term swaps. */
function winWinTrades(sc,picks){
  const base=scoreOf(sc,picks), out=[], seen=new Set();
  for(let a=0;a<sc.issues.length;a++)for(let b=a+1;b<sc.issues.length;b++){
    for(const oa of sc.issues[a].options){
      if(oa.key===picks[a])continue;
      for(const ob of sc.issues[b].options){
        if(ob.key===picks[b])continue;
        const alt=picks.slice();alt[a]=oa.key;alt[b]=ob.key;
        const s=scoreOf(sc,alt);
        if(s.you<base.you||s.them<base.them||(s.you===base.you&&s.them===base.them))continue;
        const aDown=oa.you<=optionOf(sc.issues[a],picks[a]).you;
        const give=aDown?a:b, take=aDown?b:a, giveOpt=aDown?oa:ob, takeOpt=aDown?ob:oa;
        const tag=sc.issues[give].label+"|"+sc.issues[take].label;
        out.push({tag,giveLabel:sc.issues[give].label,giveFrom:optionOf(sc.issues[give],picks[give]).label,giveTo:giveOpt.label,
          takeLabel:sc.issues[take].label,takeFrom:optionOf(sc.issues[take],picks[take]).label,takeTo:takeOpt.label,
          you:s.you-base.you,them:s.them-base.them});
      }
    }
  }
  out.sort((x,y)=>(y.you+y.them)-(x.you+x.them)||y.you-x.you);
  const uniq=[];for(const t of out){if(seen.has(t.tag))continue;seen.add(t.tag);uniq.push(t)}
  return uniq;
}
function buildReview(){
  const {sc,outcome}=G;
  const viable=viablePackages(sc);
  const best=viable.length?viable.reduce((a,b)=>b.you>a.you?b:a):null;
  const bestScore=best?best.you:sc.buyerWalk;
  const dealt=!!outcome.picks;
  const s=dealt?scoreOf(sc,outcome.picks):{you:sc.buyerWalk,them:sc.sellerWalk};
  const available=Math.max(1,bestScore-sc.buyerWalk);
  const capture=Math.max(0,Math.min(1,(s.you-sc.buyerWalk)/available));
  const joint=s.you+s.them, mj=maxJoint(sc), efficiency=dealt?joint/mj:0;
  let valueLeft=0;
  if(dealt){let bs=joint;
    for(const p of allPackages(sc))if(p.you>=s.you&&p.them>=s.them&&p.you+p.them>bs)bs=p.you+p.them;
    valueLeft=bs-joint;}
  const rows=dealt?sc.issues.map((iss,i)=>{
    const o=optionOf(iss,outcome.picks[i]), ys=stakeYou(iss), ts=stakeThem(iss);
    const yShare=ys?o.you/ys:0, tShare=ts?o.them/ts:0;
    return{label:iss.label,you:o.you,yourStake:ys,them:o.them,theirStake:ts,
      winner:Math.abs(yShare-tShare)<0.2?"split":(yShare>tShare?"you":"them"),yShare};
  }):[];
  let grade="F",note="No deal. A signable package existed and neither of you found it.";
  if(dealt){
    const v=0.65*capture+0.35*efficiency;
    const scale=[[0.90,"A+","Close to the best outcome available to you. Genuinely well negotiated."],
      [0.80,"A","Strong. You found the trades and took most of what was gettable."],
      [0.70,"B","Solid. You made real trades but left some on the table."],
      [0.58,"C","Workable deal, ordinary negotiation. The value was there to take."],
      [0.45,"D","You signed something worse than you needed to."]];
    grade="F";note="This deal cost you most of what was available.";
    for(const[cut,g,n]of scale)if(v>=cut){grade=g;note=n;break}
  }
  return{s,rows,capture,efficiency,valueLeft,grade,note,best,bestScore,dealt,viable,
    trades:dealt?winWinTrades(sc,outcome.picks).slice(0,3):[]};
}
function lessonsFor(rev){
  const {sc,outcome,log}=G, out=[];
  const add=(sev,title,detail)=>out.push({sev,title,detail});
  if(rev.dealt&&rev.s.you<sc.buyerWalk)
    add("critical","You signed a deal worse than no deal",
      `This package is worth ${rev.s.you} to you. Walking away was worth ${sc.buyerWalk}. Your walk-away is not a guideline; it is the whole reason you have one.`);
  if(outcome.fleeced)
    add("critical","They accepted instantly, and that told you everything",
      "When the other side signs without a single counter, you were never near their limit. An offer taken on the spot was too generous. Open worse next time.");
  if(outcome.kind==="raged")
    add("critical","You pushed them out of the room",
      "Aggression is a tool, not a personality. You used it on someone with no tolerance for it and got nothing. Reading who you are dealing with comes before deciding how hard to push.");
  if(!rev.dealt)
    add("major","A deal existed and you did not find it",
      `${rev.viable.length} packages would have been signed by both of you. The best was worth ${rev.bestScore} to you, against ${sc.buyerWalk} for walking. No deal is sometimes right; here it cost you ${rev.bestScore-sc.buyerWalk} points.`);
  if(rev.rows.length){
    const biggest=rev.rows.reduce((a,b)=>b.yourStake>a.yourStake?b:a);
    const cheapest=rev.rows.reduce((a,b)=>b.yourStake<a.yourStake?b:a);
    if(biggest.yShare<0.4)
      add("major",`You lost ${biggest.label.toLowerCase()}, your biggest issue`,
        `It was worth ${biggest.yourStake} points to you &mdash; more than any other term &mdash; and you came away with ${biggest.you}. Whatever else you trade, protect the top of your list.`);
    if(cheapest.yShare>0.5&&cheapest.theirStake>cheapest.yourStake*2)
      add("major",`You kept ${cheapest.label.toLowerCase()}, which you did not need`,
        `That term was worth ${cheapest.yourStake} to you and ${cheapest.theirStake} to them. Handing it over costs you almost nothing and buys enormous goodwill. It is the most reliable trade in the game and you sat on it.`);
    const middles=sc.issues.filter((iss,i)=>{
      const idx=iss.options.findIndex(o=>o.key===outcome.picks[i]);
      return idx>0&&idx<iss.options.length-1}).length;
    if(middles>=3)
      add("major","You split the difference on almost everything",
        `${middles} of the five terms landed on a middle option. Meeting in the middle feels fair and is usually the worst deal available: it wins you nothing you care about and gives them nothing they care about.`);
  }
  if(rev.dealt&&rev.valueLeft>0)
    add(rev.valueLeft>12?"major":"minor",`You left ${rev.valueLeft} points on the table`,
      "That is value neither of you collected. A package existed that was better for BOTH of you, so this is not about who won &mdash; it is money you both set on fire.");
  else if(rev.dealt)
    add("good","Your deal was efficient",
      "No package existed that would have been better for both of you. Whatever else happened, the two of you found the whole pie.");
  if(!log.asked)
    add("major","You never asked what mattered to them",
      "It costs nothing, it costs no round, and most of them will tell you something true. You cannot trade efficiently while guessing what the other side values.");
  else add("good","You asked what they cared about",
      "The highest-return question in any negotiation, and most people never ask it once.");
  if(log.revealed.length){
    const labels=log.revealed.map(k=>sc.issues.find(i=>i.key===k).label.toLowerCase()).join(", ");
    add("major","You told them where you would bend",
      `You volunteered that you were flexible on ${labels}. Flexibility is a thing you sell, not a thing you announce. Once they know you don't want it, they stop paying you for it.`);
  }
  if(log.insults>=2)
    add("minor","You spent goodwill you did not need to spend",
      "Rudeness is occasionally leverage and usually just expensive. It shortens their patience and buys you nothing structural.");
  if(log.offers.length>=2){
    const drop=scoreOf(sc,log.offers[0]).you-scoreOf(sc,log.offers[1]).you;
    if(drop>15)add("minor","You conceded too much, too early",
      `Your second offer was ${drop} points worse for you than your first. Big early concessions teach the other side that waiting works. Move in small steps and make them pay for each one.`);
  }
  if(log.offers.length&&scoreOf(sc,log.offers[0]).you<80)
    add("minor","Your opening offer was too modest",
      `You opened at ${scoreOf(sc,log.offers[0]).you} out of 100 for yourself. An opening is an anchor, not a prediction. Open high enough that you have somewhere to concede from.`);
  if(outcome.kind==="signed"&&G.rounds-G.round>=2)
    add("minor","You signed with rounds to spare",
      `You used ${G.round} of ${G.rounds}. Their demands fall as the clock runs down. Unused rounds are unused leverage.`);
  if(rev.dealt&&rev.capture>=0.8)
    add("good","You took most of what was available",
      `The most any buyer could have extracted here, given what they would sign, was ${rev.bestScore}. You got ${rev.s.you}.`);
  const order={critical:0,major:1,minor:2,good:3};
  out.sort((a,b)=>order[a.sev]-order[b.sev]);
  return out;
}
function frontierSVG(rev){
  const sc=G.sc, CW=440,CH=290,pad=34;
  const x=v=>pad+(v/100)*(CW-pad-14), y=v=>CH-pad-(v/100)*(CH-pad-16);
  const dots=allPackages(sc).map(p=>`<circle cx="${x(p.you).toFixed(1)}" cy="${y(p.them).toFixed(1)}" r="1.5" fill="#3A342C"/>`).join("");
  const front=frontier(sc).map(p=>`<circle cx="${x(p.you).toFixed(1)}" cy="${y(p.them).toFixed(1)}" r="2.8" fill="#6F675B"/>`).join("");
  const bestMark=rev.best?`<circle cx="${x(rev.best.you)}" cy="${y(rev.best.them)}" r="6" fill="none" stroke="#C9873F" stroke-width="2.5"/>`:"";
  const you=rev.dealt
    ?`<circle cx="${x(rev.s.you)}" cy="${y(rev.s.them)}" r="7.5" fill="#4EA8A0" stroke="#12100E" stroke-width="2.5"/>`
    :`<g stroke="#C2554A" stroke-width="3.5" stroke-linecap="round"><path d="M ${x(sc.buyerWalk)-6} ${y(sc.sellerWalk)-6} L ${x(sc.buyerWalk)+6} ${y(sc.sellerWalk)+6}"/><path d="M ${x(sc.buyerWalk)+6} ${y(sc.sellerWalk)-6} L ${x(sc.buyerWalk)-6} ${y(sc.sellerWalk)+6}"/></g>`;
  return `<svg viewBox="0 0 ${CW} ${CH}" style="width:100%;height:auto" role="img"
      aria-label="Every possible deal plotted by your score and theirs, with yours marked">
    <line x1="${pad}" y1="${CH-pad}" x2="${CW-10}" y2="${CH-pad}" stroke="#3A342C"/>
    <line x1="${pad}" y1="14" x2="${pad}" y2="${CH-pad}" stroke="#3A342C"/>
    <line x1="${x(sc.buyerWalk)}" y1="14" x2="${x(sc.buyerWalk)}" y2="${CH-pad}" stroke="#4EA8A0" stroke-dasharray="4 4" opacity=".55"/>
    <line x1="${pad}" y1="${y(sc.sellerWalk)}" x2="${CW-10}" y2="${y(sc.sellerWalk)}" stroke="#C9873F" stroke-dasharray="4 4" opacity=".55"/>
    ${dots}${front}${bestMark}${you}
    <text x="${pad}" y="${CH-12}" fill="#6F675B" font-size="11" font-family="Archivo,sans-serif">0</text>
    <text x="${CW-14}" y="${CH-12}" fill="#6F675B" font-size="11" text-anchor="end" font-family="Archivo,sans-serif">your score 100</text>
    <text x="${pad-8}" y="20" fill="#6F675B" font-size="11" text-anchor="end" font-family="Archivo,sans-serif">100</text>
    <text x="14" y="${CH/2}" fill="#6F675B" font-size="11" text-anchor="middle" font-family="Archivo,sans-serif" transform="rotate(-90 14 ${CH/2})">their score</text>
    <text x="${x(sc.buyerWalk)+5}" y="26" fill="#4EA8A0" font-size="10" font-family="Archivo,sans-serif">your floor</text>
    <text x="${CW-14}" y="${y(sc.sellerWalk)-6}" fill="#C9873F" font-size="10" text-anchor="end" font-family="Archivo,sans-serif">their floor</text>
  </svg>`;
}
const HEADLINE={signed:"Deal signed.",youwalked:"You walked away. No deal.",
  theywalked:"They walked away. No deal.",raged:"They lost their temper and walked out.",
  timeout:"The clock ran out. No deal."};

function showDebrief(){
  const rev=buildReview(), lessons=lessonsFor(rev), p=G.ch.persona;
  const good=["A+","A","B"].includes(rev.grade);
  const farewell=pickLine(p,good?"goodbye":"badbye",G.rng);
  const gradeClass=good?"hi":(rev.grade==="C"||rev.grade==="D")?"mid":"lo";
  restartBtn.hidden=false;
  app.innerHTML=`
  <div class="scene" style="border-radius:13px;margin-bottom:14px">${sceneSVG(G.ch,good?"pleased":"smug",G.seed)}</div>
  <div class="panel">
    <div class="eyebrow">${esc(HEADLINE[G.outcome.kind]||"Session over")}</div>
    <div class="verdict" style="margin-top:12px">
      <div class="grade ${gradeClass}">${rev.grade}</div>
      <div class="stats">
        <div class="stat"><b>${rev.s.you}</b><span>your score</span></div>
        <div class="stat"><b>${rev.s.them}</b><span>their score</span></div>
        <div class="stat"><b>${Math.round(rev.capture*100)}%</b><span>value captured</span></div>
        <div class="stat"><b>${rev.dealt?Math.round(rev.efficiency*100)+"%":"&mdash;"}</b><span>pie found</span></div>
        <div class="stat"><b>${rev.dealt?rev.valueLeft:"&mdash;"}</b><span>left on table</span></div>
      </div>
    </div>
    <p class="lede" style="margin-top:14px">${esc(rev.note)}</p>
  </div>
  <div class="cols" style="margin-top:14px">
    <div>
      <div class="panel">
        <div class="eyebrow">Who you were up against</div>
        <h3 style="font-size:19px;margin-top:6px">${esc(G.ch.name)}</h3>
        <div style="color:var(--them);font-family:var(--display);font-size:16px">${esc(p.name)}</div>
        <p style="color:var(--ink-dim);font-size:13px;margin:8px 0 0">${esc(p.blurb)}</p>
        <p style="color:var(--ink-dim);font-size:13px;margin:8px 0 0"><em>Tell:</em> ${esc(p.tell)}</p>
        <div class="rule" style="margin:14px 0"></div>
        <div class="eyebrow">What you could have read off them</div>
        <p style="color:var(--ink-dim);font-size:13px;margin:8px 0 0"><b style="color:var(--ink)">The look:</b> ${esc(p.look)}</p>
        <p style="color:var(--ink-dim);font-size:13px;margin:6px 0 0"><b style="color:var(--ink)">The room:</b> ${esc(OFFICES[p.room].blurb)}</p>
        <div class="card" style="margin-top:14px"><p style="margin:0;font-size:15px">&ldquo;${esc(farewell)}&rdquo;</p></div>
      </div>
      <div class="panel">
        <div class="eyebrow">Every deal that was possible</div>
        ${frontierSVG(rev)}
        <div class="legend">
          <span><i style="background:#3A342C"></i>possible</span>
          <span><i style="background:#6F675B"></i>efficient edge</span>
          <span><i style="box-shadow:inset 0 0 0 2px #C9873F"></i>best available</span>
          <span><i style="background:#4EA8A0"></i>${rev.dealt?"your deal":"no deal"}</span>
        </div>
      </div>
    </div>
    <div>
      ${rev.rows.length?`<div class="panel">
        <div class="eyebrow">Who won what</div>
        <table class="scorecard">
          <thead><tr><th>Term</th><th style="text-align:right">You</th><th style="text-align:right">Them</th><th></th></tr></thead>
          <tbody>${rev.rows.map(r=>`<tr>
            <td>${esc(r.label)}</td>
            <td class="n" style="color:var(--you)">${r.you}<span style="color:var(--ink-faint)">/${r.yourStake}</span></td>
            <td class="n" style="color:var(--them)">${r.them}<span style="color:var(--ink-faint)">/${r.theirStake}</span></td>
            <td><span class="won ${r.winner}">${r.winner==="you"?"you took it":r.winner==="them"?"they took it":"split"}</span></td>
          </tr>`).join("")}</tbody></table>
        <p style="color:var(--ink-dim);font-size:13px;margin:10px 0 0">
          Read the denominators, not the scores. A term worth 5 to you and 35 to them
          is one you should be selling, not winning.</p>
      </div>`:""}
      ${rev.trades.length?`<div class="panel">
        <div class="eyebrow">Trades that would have helped both of you</div>
        <p style="color:var(--ink-dim);font-size:13px;margin:0 0 12px">
          No single term can do this &mdash; each one is a straight tug of war.
          Give ground on one, take it on another, and you both come out ahead.</p>
        <div style="display:flex;flex-direction:column;gap:10px">
        ${rev.trades.map(t=>`<div class="trade">
          <div class="line"><span class="tag give">Give</span><span>${esc(t.giveLabel)}: <s>${esc(t.giveFrom)}</s> &rarr; ${esc(t.giveTo)}</span></div>
          <div class="line"><span class="tag take">Take</span><span>${esc(t.takeLabel)}: <s>${esc(t.takeFrom)}</s> &rarr; ${esc(t.takeTo)}</span></div>
          <div class="gain">you +${t.you}, them +${t.them}</div></div>`).join("")}
        </div></div>`:""}
      <div class="panel">
        <div class="eyebrow">What to do differently</div>
        ${lessons.map(l=>`<div class="lesson ${l.sev}">
          <div class="mark">${l.sev==="critical"?"!!":l.sev==="major"?"!":l.sev==="good"?"+":"&ndash;"}</div>
          <div><h4>${l.title}</h4><p>${l.detail}</p></div></div>`).join("")}
      </div>
    </div>
  </div>
  <div class="panel" style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <button class="btn primary" id="again">New deal, new person</button>
    <button class="btn" id="replay">Replay this exact deal</button>
    <span style="color:var(--ink-faint);font-size:12px">deal #${G.seed}</span>
  </div>`;
  document.getElementById("again").onclick=()=>newGame();
  document.getElementById("replay").onclick=()=>newGame(G.seed);
  restartBtn.onclick=()=>newGame();
  window.scrollTo({top:0,behavior:reduced()?"auto":"smooth"});
}

/* ======================================================================
   11. Boot.
   ====================================================================== */
function start(saved){ newGame(saved&&saved.seed?saved.seed:undefined) }
try{ window.claude?.hot?.snapshot?.(()=>({seed:G?G.seed:null})) }catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);
else start(window.claude?.hot?.data??{});
</script>
